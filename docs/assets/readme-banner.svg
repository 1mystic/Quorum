<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 300"
     width="1200"
     height="300"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Quorum</title>
  <desc id="desc">
    Enough to decide. A statistical instrument for ordinary communities.
  </desc>

  <!-- =========================================================
       QUORUM, WARM INSTRUMENT
       ========================================================= -->

  <defs>

    <!-- Soft fade for the background graticule -->
    <mask id="fade">
      <rect
        x="0"
        y="0"
        width="1200"
        height="300"
        fill="url(#fadeGrad)"
      />
    </mask>

    <radialGradient
      id="fadeGrad"
      cx="50%"
      cy="42%"
      r="65%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>

    <!-- 40px technical grid -->
    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse">

      <path
        d="M40 0H0V40"
        fill="none"
        stroke="#E6DFD4"
        stroke-width="1"/>
    </pattern>

  </defs>


  <!-- =========================================================
       BACKGROUND
       ========================================================= -->

  <rect
    x="0"
    y="0"
    width="1200"
    height="300"
    rx="20"
    fill="#FAF7F2"/>

  <!-- Original subtle graticule -->
  <rect
    x="0"
    y="0"
    width="1200"
    height="300"
    fill="url(#grid)"
    mask="url(#fade)"/>

  <!-- Outer frame -->
  <rect
    x="1.5"
    y="1.5"
    width="1197"
    height="297"
    rx="18.5"
    fill="none"
    stroke="#DED6CA"
    stroke-width="2"/>


  <!-- =========================================================
       PRIMARY BRAND LOCKUP
       ========================================================= -->

  <!--
    Enlarged threshold mark.
    The mark is vertically centered against the complete
    Quorum + tagline lockup.
  -->

  <g transform="translate(73 60) scale(1.25)">

    <!-- Filled lower threshold -->
    <path
      d="M16.1 73.9a45 45 0 0 0 87.8 0Z"
      fill="#13594A"/>

    <!-- Instrument / circle -->
    <circle
      cx="60"
      cy="60"
      r="45"
      fill="none"
      stroke="#12100E"
      stroke-width="8.6"/>

    <!-- Horizontal threshold rule -->
    <rect
      x="0"
      y="68.7"
      width="120"
      height="9.8"
      rx="4.9"
      fill="#E07A3F"/>

  </g>


  <!-- =========================================================
       WORDMARK
       ========================================================= -->

  <text
    x="260"
    y="145"
    font-family="Bricolage Grotesque, Arial, Helvetica, sans-serif"
    font-size="82"
    font-weight="700"
    letter-spacing="-3.4"
    fill="#12100E">

    Quorum

  </text>


  <!-- =========================================================
       TAGLINE
       ========================================================= -->

  <text
    x="274"
    y="195"
    font-family="Inter Tight, Arial, Helvetica, sans-serif"
    font-size="25"
    font-weight="500"
    letter-spacing="-0.25"
    fill="#544E47">

    Enough to decide.

  </text>


  <!-- =========================================================
       RIGHT INFORMATION PANEL
       ========================================================= -->

  <!-- Vertical separator -->
  <line
    x1="805"
    y1="66"
    x2="805"
    y2="234"
    stroke="#D1C7B9"
    stroke-width="1.5"/>


  <!-- Community operations -->
  <circle
    cx="840"
    cy="122"
    r="5.5"
    fill="#13594A"/>

  <text
    x="858"
    y="129"
    font-family="Inter Tight, Arial, Helvetica, sans-serif"
    font-size="21"
    font-weight="650"
    letter-spacing="-0.1"
    fill="#12100E">

    community operations

  </text>


  <!-- Statistically honest -->
  <circle
    cx="840"
    cy="166"
    r="5.5"
    fill="#13594A"/>

  <text
    x="858"
    y="173"
    font-family="Inter Tight, Arial, Helvetica, sans-serif"
    font-size="21"
    font-weight="650"
    letter-spacing="-0.1"
    fill="#12100E">

    statistically honest

  </text>

</svg>
