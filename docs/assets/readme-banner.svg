<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Quorum">
  <title>Quorum</title>
  <desc>Enough to decide. A statistical instrument for ordinary communities.</desc>

  <rect x="0" y="0" width="1200" height="300" rx="20" fill="#FAF7F2"/>
  <rect x="1.5" y="1.5" width="1197" height="297" rx="18.5" fill="none" stroke="#E6DFD4" stroke-width="2"/>

  <!-- faint graticule, masked to fade toward the edges -->
  <defs>
    <mask id="fade">
      <rect x="0" y="0" width="1200" height="300" fill="url(#fadeGrad)"/>
    </mask>
    <radialGradient id="fadeGrad" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E6DFD4" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1200" height="300" fill="url(#grid)" mask="url(#fade)"/>

  <!-- mark: a circle with a horizontal chord overshooting both edges, area below filled -->
  <g transform="translate(90 76)">
    <path d="M16.1 73.9a45 45 0 0 0 87.8 0Z" fill="#13594A"/>
    <circle cx="60" cy="60" r="45" fill="none" stroke="#1A1714" stroke-width="8.6"/>
    <rect x="0" y="68.7" width="120" height="9.8" rx="4.9" fill="#E07A3F"/>
  </g>

  <text x="255" y="140" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700"
        letter-spacing="-2.4" fill="#1A1714">Quorum</text>

  <text x="257" y="184" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400"
        fill="#544E47">Enough to decide.</text>

  <text x="90" y="248" font-family="Courier New, monospace" font-size="16" letter-spacing="0.5"
        fill="#8A8278">community operations, statistically honest</text>

  <g transform="translate(940 235)" font-family="Courier New, monospace" font-size="13" fill="#8A8278">
    <rect x="0" y="-16" width="230" height="34" rx="6" fill="#FFFFFF" stroke="#D3C9BA" stroke-width="1"/>
    <circle cx="18" cy="1" r="4" fill="#13594A"/>
    <text x="30" y="6">n, interval, method: always</text>
  </g>
</svg>
