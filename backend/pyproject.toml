[project]
name = "quorum-backend"
version = "0.1.0"
description = "Backend API for Quorum, a multi-tenant community operations platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "anthropic>=0.40.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "boto3>=1.43.67",
    "cairosvg>=2.9.0",
    "fastapi>=0.138.1",
    "google-auth>=2.28",
    "jinja2>=3.1.6",
    "openai>=1.60.0",
    "pgvector>=0.4.2",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.9",
    "qrcode>=8.2",
    "requests>=2.31",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.49.0",
]

[tool.pytest.ini_options]
# Run tests from the backend root so `import app...` and `import main` resolve.
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:coroutine 'Connection._cancel' was never awaited:RuntimeWarning",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-json-report>=1.5.0",
]
