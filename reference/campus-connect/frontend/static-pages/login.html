<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In : Campus Connect</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-body">

  <div class="auth-frame">

    <!-- Left: Sidebar -->
    <aside class="auth-sidebar orange-auth">

      <div onclick="location.href='index.html'" class="auth-sidebar-logo">
        <div class="auth-sidebar-logo-mark">
          <i data-lucide="graduation-cap"></i>
        </div>
        <span class="brand">Campus Connect</span>
      </div>

      <div>
        <h2 class="auth-sidebar-title">Welcome<br>back.</h2>
        <p class="auth-sidebar-desc">
          Pick up where you left off. Your clubs, events and certificates are all waiting.
        </p>
      </div>

      <div class="auth-sidebar-circle-1"></div>
      <div class="auth-sidebar-circle-2"></div>

      <!-- Character SVG (variant 2 - dark red background) -->
      <div class="auth-sidebar-char">
        <svg class="svg-fill" viewBox="0 0 240 240">
          <rect x="6" y="6" width="228" height="228" rx="46" fill="#6E3A2E" />
          <path d="M58 234 Q58 176 120 176 Q182 176 182 234 Z" fill="#C23E3E" />
          <rect x="104" y="148" width="32" height="42" rx="14" fill="#E7B58E" />
          <ellipse cx="120" cy="110" rx="50" ry="54" fill="#E7B58E" />
          <path d="M70 110 Q68 50 120 50 Q172 50 170 110 Q150 80 120 80 Q90 80 70 110 Z" fill="#241712" />
          <path d="M64 112 Q62 44 120 44 Q178 44 176 112" fill="none" stroke="#F2802B" stroke-width="13" stroke-linecap="round" />
          <rect x="50"  y="98" width="22" height="46" rx="11" fill="#F2802B" />
          <rect x="168" y="98" width="22" height="46" rx="11" fill="#F2802B" />
          <circle cx="104" cy="113" r="5" fill="#2E1D16" />
          <circle cx="136" cy="113" r="5" fill="#2E1D16" />
          <circle cx="95"  cy="129" r="7" fill="#C9603A" opacity=".55" />
          <circle cx="145" cy="129" r="7" fill="#C9603A" opacity=".55" />
          <path d="M104 134 Q120 151 136 134" fill="none" stroke="#2E1D16" stroke-width="5" stroke-linecap="round" />
        </svg>
      </div>

      <div class="auth-sidebar-sticker">Your clubs await</div>

    </aside>

    <!-- Right: Form -->
    <section class="auth-form-panel custom-scrollbar">

      <h2>Sign in</h2>
      <p class="auth-form-subtitle">
        New here? <span onclick="location.href='signup.html'">Create an account</span>
      </p>

      <!-- Email -->
      <div class="form-group">
        <label for="email-input">College Email Address</label>
        <div class="input-icon-wrapper">
          <i data-lucide="mail"></i>
          <input type="email" id="email-input" placeholder="shikha@knit.ac.in">
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password-input">Password</label>
        <div class="input-icon-wrapper login-password-row">
          <div class="input-icon-left">
            <i data-lucide="lock"></i>
            <input type="password" id="password-input" placeholder="Enter your password">
          </div>
          <i data-lucide="eye" class="icon-clickable" id="eye-toggle" onclick="togglePasswordVisibility()"></i>
        </div>
      </div>

      <!-- Remember / forgot row -->
      <div class="auth-checkbox-row">
        <div class="auth-checkbox">
          <div class="auth-checkbox-box" id="remember-box" onclick="toggleRemember()">
            <i data-lucide="check" id="remember-check"></i>
          </div>
          <span>Remember me</span>
        </div>
        <a href="forgot-password.html" class="auth-forgot-link">Forgot password?</a>
      </div>

      <button onclick="handleLogin()" class="btn-auth-submit">
        <i data-lucide="arrow-right"></i> Sign in
      </button>

      <div class="auth-divider-row">
        <span class="auth-divider-line"></span>
        <span>or</span>
        <span class="auth-divider-line"></span>
      </div>

      <div class="auth-sso-grid">
        <button class="btn-sso" onclick="handleLogin()">
          <i data-lucide="globe"></i> Google SSO
        </button>
        <button class="btn-sso" onclick="handleLogin()">
          <i data-lucide="school"></i> College Portal
        </button>
      </div>

    </section>

  </div>

  <script>
    lucide.createIcons();

    var rememberChecked = true;
    var passwordVisible = false;

    function toggleRemember() {
      rememberChecked = !rememberChecked;
      var box = document.getElementById('remember-box');
      var check = document.getElementById('remember-check');
      if (rememberChecked) {
        box.style.opacity = '1';
        check.style.display = '';
      } else {
        box.style.opacity = '0.3';
        check.style.display = 'none';
      }
    }

    function togglePasswordVisibility() {
      passwordVisible = !passwordVisible;
      var input = document.getElementById('password-input');
      input.type = passwordVisible ? 'text' : 'password';
    }

    function getLoginValues() {
      return {
        email:    document.getElementById('email-input').value.trim(),
        password: document.getElementById('password-input').value
      };
    }

    function handleLogin() {
      var formData = getLoginValues();

      if (!formData.email || !formData.password) {
        alert('Please enter your email and password.');
        return;
      }

      // In production this calls POST /api/v1/auth/login
      // and reads the role from the returned JWT to route accordingly.
      // For now redirecting to club directory as the default landing.
      window.location.href = 'clubs.html';
    }
  </script>
</body>
</html>
