          maxLength: 1000
          minLength: 5
          title: Description
      type: object
      required:
      - name
      - email_suffix
      - description
      title: CollegeOnboardingRequest
      description: Institution details supplied by the campus admin. `email_suffix` is the verified student
        email domain, for example `knit.ac.in`; every future signup on that domain is routed to this college
        automatically.
    CollegeOnboardingResponse:
      properties:
