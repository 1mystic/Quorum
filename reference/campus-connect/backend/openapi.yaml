      - status
      - image_url
      - created_at
      - results_declared
      title: EventListItem
      description: One event in a listing. `seats_left` is `null` when the event is uncapped, otherwise
        `capacity` minus the current registration count, floored at zero. `results_declared` is true
        once a winner or runner up has been set for the event, which lets a club leader's listing tell
        "set results" from "view results" without a request per event.
    EventStatus:
      type: string
      enum:
      - DRAFT
      - PUBLISHED
      - CANCELLED
      title: EventStatus
      description: |-
        Lifecycle state of an event.

        * `DRAFT` - created but not announced. Visible only to leaders of the hosting club and to campus admins.
        * `PUBLISHED` - live and open for registration until the start time.
        * `CANCELLED` - terminal. Cannot be edited, published or registered for.
    EventStatusResponse:
      properties:
        id:
          type: integer
          title: Id
        title:
          type: string
          title: Title
        status:
          $ref: '#/components/schemas/EventStatus'
        message:
          type: string
          title: Message
      type: object
      required:
      - id
      - title
      - status
      - message
      title: EventStatusResponse
      description: Confirmation of an event status change - publication or cancellation.
    ForgotPasswordRequest:
      properties:
        email:
          type: string
          maxLength: 255
          format: email
          title: Email
      type: object
      required:
      - email
      title: ForgotPasswordRequest
      description: The address to send a reset link to. Trimmed and lower-cased before lookup, exactly
        as on signup. An address that belongs to no account is accepted without comment.
    ForgotPasswordResponse:
      properties:
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: ForgotPasswordResponse
      description: 'Fixed acknowledgement. The wording is intentionally conditional - `If that email is
        registered...` - and identical for registered and unregistered addresses, so a client cannot learn
        which emails have accounts. There is nothing here to branch on.'
    GoogleAuthRequest:
      properties:
        id_token:
          type: string
          minLength: 1
          title: Id Token
        intent:
          type: string
          enum:
          - login
          - signup
          default: login
          title: Intent
      type: object
      required:
      - id_token
      title: GoogleAuthRequest
      description: A Google ID token (the JWT credential returned by Google Sign-In on the client), plus the
        `intent`. The server verifies the token against Google and derives the account's email, name and picture
        from its claims - nothing else about the user is accepted from the client. `intent` is `login` (default,
        sign in an existing account only) or `signup` (create the account when none exists).
    GoogleAuthResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        is_new_user:
          type: boolean
          title: Is New User
        message:
          type: string
          title: Message
      type: object
      required:
      - access_token
      - refresh_token
      - is_new_user
      - message
      title: GoogleAuthResponse
      description: Issued token pair for the signed-in account, plus `is_new_user` - true when this call
        created the account, false when it logged in an existing one.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
      description: Returned with `422` when the request body, query string or path parameters fail schema
        validation, before any handler runs. Note that this uses the `detail` key, not the `message` key
        of the standard `Error` envelope.
    IssueActionResponse:
      properties:
        id:
          type: integer
          title: Id
        status:
          $ref: '#/components/schemas/IssueStatus'
        message:
          type: string
          title: Message
      type: object
      required:
      - id
      - status
      - message
      title: IssueActionResponse
      description: The issue after a reply or a resolve.
    IssueCategory:
      type: string
      enum:
      - EVENT
      - CLUB
      - CERTIFICATE
      - TECHNICAL
      - GENERAL
      title: IssueCategory
      description: |-
        Subject area of a member's query, used to route and filter the leader's queue.

        * `EVENT` - about a specific event or registration. Pair with `event_id`.
        * `CLUB` - about membership or club operations.
        * `CERTIFICATE` - about participation proof.
        * `TECHNICAL` - a platform problem.
        * `GENERAL` - anything else.
    IssueResponseInfo:
      properties:
        by:
          type: string
          title: By
        text:
          type: string
          title: Text
        at:
          type: string
          format: date-time
          title: At
      type: object
      required:
      - by
      - text
      - at
      title: IssueResponseInfo
      description: 'The leader''s reply on an issue: who wrote it, its text, and when. `null` while the
        issue has not been replied to.'
    IssueStatus:
      type: string
      enum:
      - OPEN
      - IN_PROGRESS
      - RESOLVED
      title: IssueStatus
      description: |-
        Lifecycle state of an issue.

        * `OPEN` - submitted, no reply yet. Counted by `GET /issues/club/open-count`.
        * `IN_PROGRESS` - the leader has replied but has not closed it.
        * `RESOLVED` - terminal. Accepts no further replies.
    JoinResponse:
      properties:
        id:
          type: integer
          title: Id
        club_id:
          type: integer
          title: Club Id
        status:
          $ref: '#/components/schemas/MembershipStatus'
        message:
          type: string
          title: Message
      type: object
      required:
      - id
      - club_id
      - status
      - message
      title: JoinResponse
      description: Confirmation that a join request was recorded. Always returns status `PENDING`.
    LeaderboardEntry:
      properties:
        rank:
          type: integer
          title: Rank
        club_id:
          type: integer
          title: Club Id
        name:
          type: string
          title: Name
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
        category:
          type: string
          title: Category
        score:
          type: integer
          title: Score
        events_held:
          type: integer
          title: Events Held
        new_members:
          type: integer
          title: New Members
        issues_resolved:
          type: integer
          title: Issues Resolved
        attendance_rate:
          type: number
          title: Attendance Rate
        attendance_bonus:
          type: integer
          title: Attendance Bonus
      type: object
      required:
      - rank
      - club_id
      - name
      - image_url
      - category
      - score
      - events_held
      - new_members
      - issues_resolved
      - attendance_rate
      - attendance_bonus
      title: LeaderboardEntry
      description: |-
        One club's row on the monthly activity leaderboard. `rank` is its 1-based position for the current month, `score` the integer total, and the remaining fields are the raw counts the score was built from so a client can explain the ranking.

        `attendance_rate` is a fraction between 0 and 1 - the club's average per-event check-in rate this month over events that had at least one registration - and `attendance_bonus` is that rate scaled to 0-200 and rounded, the portion of `score` it contributed.
    LeaderIssueItem:
      properties:
        id:
          type: integer
          title: Id
        club_id:
          type: integer
          title: Club Id
        club_name:
          type: string
          title: Club Name
        student_id:
          type: integer
          title: Student Id
        raised_by:
          type: string
          title: Raised By
        event_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Event Id
        category:
          $ref: '#/components/schemas/IssueCategory'
        status:
          $ref: '#/components/schemas/IssueStatus'
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
        response:
          anyOf:
          - $ref: '#/components/schemas/IssueResponseInfo'
          - type: 'null'
        created_at:
          type: string
          format: date-time
          title: Created At
        resolved_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Resolved At
      type: object
      required:
      - id
      - club_id
      - club_name
      - student_id
      - raised_by
      - event_id
      - category
      - status
      - title
      - description
      - response
      - created_at
      - resolved_at
      title: LeaderIssueItem
      description: One issue in a leader's queue. Extends the student's view with `student_id` and `raised_by`,
        identifying who raised it.
    LoginRequest:
      properties:
        email:
          type: string
          maxLength: 255
          format: email
          title: Email
        password:
          type: string
          maxLength: 255
          minLength: 8
          title: Password
      type: object
      required:
      - email
      - password
      title: LoginRequest
      description: Credentials for an existing account. Email is lower-cased and trimmed before lookup.
    LoginResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        message:
          type: string
          title: Message
      type: object
      required:
      - access_token
      - refresh_token
      - message
      title: LoginResponse
      description: Issued token pair for the authenticated account, plus a confirmation message.
    MarkAllNotificationsReadResponse:
      properties:
        updated:
          type: integer
          title: Updated
        message:
          type: string
          title: Message
      type: object
      required:
      - updated
      - message
      title: MarkAllNotificationsReadResponse
      description: Confirmation of a bulk read. `updated` is the number of notifications that were unread
        and have now been marked read.
    MarkAnnouncementsReadResponse:
      properties:
        seen_at:
          type: string
          format: date-time
          title: Seen At
        message:
          type: string
          title: Message
      type: object
      required:
      - seen_at
      - message
      title: MarkAnnouncementsReadResponse
      description: 'The new read watermark. Every announcement created before `seen_at` now reports `unread:
        false`.'
    MarkAttendanceRequest:
      properties:
        checked_in:
          type: boolean
          title: Checked In
      type: object
      required:
      - checked_in
      title: MarkAttendanceRequest
      description: Whether the student attended. Sending `false` un-marks a previous check-in and also
        resets any recorded result back to `REGISTRANT`.
    MemberItem:
      properties:
        id:
          type: integer
          title: Id
        student_id:
          type: integer
          title: Student Id
        full_name:
          type: string
          title: Full Name
        role:
          $ref: '#/components/schemas/MembershipRole'
      type: object
      required:
      - id
      - student_id
      - full_name
      - role
      title: MemberItem
      description: One member of a club, with their role in it.
    MembershipRole:
      type: string
      enum:
      - LEADER
      - MEMBER
      title: MembershipRole
      description: |-
        A student's role within one specific club.

        * `LEADER` - granted automatically to the club creator. Gates every club management action.
        * `MEMBER` - granted when a join request is approved.
    MembershipStatus:
      type: string
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      title: MembershipStatus
      description: |-
        Lifecycle state of a join request.

        * `PENDING` - submitted, awaiting the leader's decision.
        * `APPROVED` - the student is a member. Required to register for the club's events and to receive its announcements.
        * `REJECTED` - the leader declined the request.
    MyCertificateItem:
      properties:
        serial:
          type: string
          title: Serial
        result:
          $ref: '#/components/schemas/RegistrationResult'
        event_id:
          type: integer
          title: Event Id
        event_title:
          type: string
          title: Event Title
        club_name:
          type: string
          title: Club Name
        issued_at:
          type: string
          format: date-time
          title: Issued At
        download_url:
          type: string
          title: Download Url
      type: object
      required:
      - serial
      - result
      - event_id
      - event_title
      - club_name
      - issued_at
      - download_url
      title: MyCertificateItem
      description: |-
        One certificate in the caller's wallet. `serial` is the identifier everywhere else in this tag - certificates are never addressed by numeric id - and is the value an external verifier enters.

        `download_url` is signed and expires an hour after this response was generated. A client holding a stale list should call `GET /certificates/{serial}/download` for a fresh link rather than reusing this one.
    MyClubItem:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        category:
          type: string
          title: Category
        type:
          $ref: '#/components/schemas/ClubType'
        status:
          $ref: '#/components/schemas/ClubStatus'
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
        member_count:
          type: integer
          title: Member Count
        head_name:
          type: string
          title: Head Name
        created_at:
          type: string
          format: date-time
          title: Created At
        links:
          items:
            $ref: '#/components/schemas/ClubLinkSchema'
          type: array
          title: Links
        membership_id:
          type: integer
          title: Membership Id
        membership_role:
          $ref: '#/components/schemas/MembershipRole'
        membership_status:
          $ref: '#/components/schemas/MembershipStatus'
        joined_at:
          type: string
          format: date-time
          title: Joined At
      type: object
      required:
      - id
      - name
      - description
      - category
      - type
      - status
      - image_url
      - member_count
      - head_name
      - created_at
      - links
      - membership_id
      - membership_role
      - membership_status
      - joined_at
      title: MyClubItem
      description: 'A club the caller belongs to. Extends `ClubListItem` with the caller''s own membership:
        its id, whether they lead or joined it, its approval state, and when it was created.'
    MyIssueItem:
      properties:
        id:
          type: integer
          title: Id
        club_id:
          type: integer
          title: Club Id
        club_name:
          type: string
          title: Club Name
        event_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Event Id
        category:
          $ref: '#/components/schemas/IssueCategory'
        status:
          $ref: '#/components/schemas/IssueStatus'
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
        response:
          anyOf:
          - $ref: '#/components/schemas/IssueResponseInfo'
          - type: 'null'
        created_at:
          type: string
          format: date-time
          title: Created At
        resolved_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Resolved At
      type: object
      required:
      - id
      - club_id
      - club_name
      - event_id
      - category
      - status
      - title
      - description
      - response
      - created_at
      - resolved_at
      title: MyIssueItem
      description: One issue raised by the calling student, with the leader's reply if there is one.
    MyRegistrationItem:
      properties:
        registration_id:
          type: integer
          title: Registration Id
        event_id:
          type: integer
          title: Event Id
        event_title:
          type: string
          title: Event Title
        club_id:
          type: integer
          title: Club Id
        club_name:
          type: string
          title: Club Name
        venue:
          type: string
          title: Venue
        starts_at:
          type: string
          format: date-time
          title: Starts At
        ends_at:
          type: string
          format: date-time
          title: Ends At
        event_status:
          $ref: '#/components/schemas/EventStatus'
        checked_in:
          type: boolean
          title: Checked In
        result:
          $ref: '#/components/schemas/RegistrationResult'
      type: object
      required:
      - registration_id
      - event_id
      - event_title
      - club_id
      - club_name
      - venue
      - starts_at
      - ends_at
      - event_status
      - checked_in
      - result
      title: MyRegistrationItem
      description: One event the calling student has registered for, with its current status.
    MyResultItem:
      properties:
        event_id:
          type: integer
          title: Event Id
        event_title:
          type: string
          title: Event Title
        club_id:
          type: integer
          title: Club Id
        club_name:
          type: string
          title: Club Name
        venue:
          type: string
          title: Venue
        starts_at:
          type: string
          format: date-time
          title: Starts At
        registration_id:
          type: integer
          title: Registration Id
        result:
          $ref: '#/components/schemas/RegistrationResult'
      type: object
      required:
      - event_id
      - event_title
      - club_id
      - club_name
      - venue
      - starts_at
      - registration_id
      - result
      title: MyResultItem
      description: One recorded outcome for the calling student. This is the durable participation record
        that replaces results lost in chat history.
    NotificationCountResponse:
      properties:
        count:
          type: integer
          title: Count
      type: object
      required:
      - count
      title: NotificationCountResponse
      description: Number of unread notifications. Intended for a badge count.
    NotificationItem:
      properties:
        id:
          type: integer
          title: Id
        type:
          $ref: '#/components/schemas/NotificationType'
        message:
          type: string
          title: Message
        club_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Club Id
        event_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Event Id
        is_read:
          type: boolean
          title: Is Read
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - type
      - message
      - club_id
      - event_id
      - is_read
      - created_at
      title: NotificationItem
      description: One notification. `club_id` and `event_id` are populated where the notification refers
        to one, so a client can deep-link to the source record.
    NotificationReadResponse:
      properties:
        id:
          type: integer
          title: Id
        is_read:
          type: boolean
          title: Is Read
        message:
          type: string
          title: Message
      type: object
      required:
      - id
      - is_read
      - message
      title: NotificationReadResponse
      description: The notification after it was marked as read.
    NotificationType:
      type: string
      enum:
      - JOIN_APPROVED
      - JOIN_REJECTED
      - REGISTRATION_CONFIRMED
      - RESULT_POSTED
      - CERTIFICATE_ISSUED
      title: NotificationType
      description: |-
        What a notification is about. Set by the server when the notification is written.

        * `JOIN_APPROVED` / `JOIN_REJECTED` - a leader decided a join request.
        * `REGISTRATION_CONFIRMED` - an event registration succeeded.
        * `RESULT_POSTED` - a result was recorded for an attended event.
        * `CERTIFICATE_ISSUED` - reserved for the certificate workflow, not emitted in this release.
    OpenIssueCountResponse:
      properties:
        count:
          type: integer
          title: Count
      type: object
      required:
      - count
      title: OpenIssueCountResponse
      description: Number of `OPEN` issues across every club the caller leads. Intended for a badge count.
    ParticipantItem:
      properties:
        registration_id:
          type: integer
          title: Registration Id
        student_id:
          type: integer
          title: Student Id
        full_name:
          type: string
          title: Full Name
        email:
          type: string
          title: Email
        roll_no:
          anyOf:
          - type: string
          - type: 'null'
          title: Roll No
        branch:
          anyOf:
          - type: string
          - type: 'null'
          title: Branch
        year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year
        checked_in:
          type: boolean
          title: Checked In
        checked_in_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Checked In At
        result:
          $ref: '#/components/schemas/RegistrationResult'
        registered_at:
          type: string
          format: date-time
          title: Registered At
      type: object
      required:
      - registration_id
      - student_id
      - full_name
      - email
      - roll_no
      - branch
      - year
      - checked_in
      - checked_in_at
      - result
      - registered_at
      title: ParticipantItem
      description: One registered student on a leader's participant list, including contact details, current
        check-in state and recorded result.
    PendingRequestItem:
      properties:
        id:
          type: integer
          title: Id
        student_id:
          type: integer
          title: Student Id
        full_name:
          type: string
          title: Full Name
        role:
          $ref: '#/components/schemas/MembershipRole'
        status:
          $ref: '#/components/schemas/MembershipStatus'
      type: object
      required:
      - id
      - student_id
      - full_name
      - role
      - status
      title: PendingRequestItem
      description: One join request awaiting the leader's decision.
    PinAnnouncementRequest:
      properties:
        pinned:
          type: boolean
          title: Pinned
      type: object
      required:
      - pinned
      title: PinAnnouncementRequest
      description: Whether to pin the announcement to the top of the feed.
    PinAnnouncementResponse:
      properties:
        id:
          type: integer
          title: Id
        title:
          type: string
          title: Title
        is_pinned:
          type: boolean
          title: Is Pinned
        message:
          type: string
          title: Message
      type: object
      required:
      - id
      - title
      - is_pinned
      - message
      title: PinAnnouncementResponse
      description: The announcement after its pinned state was changed.
    PublicStudentResponse:
      properties:
        student_id:
          type: integer
          title: Student Id
        full_name:
          type: string
          title: Full Name
        profile_image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Profile Image Url
        branch:
          anyOf:
          - type: string
          - type: 'null'
          title: Branch
        year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year
        joined_clubs:
          items:
            $ref: '#/components/schemas/StudentClubItem'
          type: array
          title: Joined Clubs
      type: object
      required:
      - student_id
      - full_name
      - profile_image_url
      - branch
      - year
      - joined_clubs
      title: PublicStudentResponse
      description: |-
        The public view of a student, returned to anyone in the same college by `GET /students/{student_id}`.

        Deliberately narrower than `StudentProfileResponse`: `email`, `bio`, `roll_no` and `created_at` are withheld from every caller, including campus admins. `branch` and `year` are null until the student fills them in, which only they can do.
    RaiseIssueRequest:
      properties:
        club_id:
          type: integer
          title: Club Id
        category:
          $ref: '#/components/schemas/IssueCategory'
        title:
          type: string
          maxLength: 150
          minLength: 3
          title: Title
        description:
          type: string
          maxLength: 2000
          minLength: 10
          title: Description
        event_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Event Id
      type: object
      required:
      - club_id
      - category
      - title
      - description
      title: RaiseIssueRequest
      description: A query for the club leader. `event_id` is optional and, when supplied, must belong
        to the same club as `club_id`.
    RaiseIssueResponse:
      properties:
        id:
          type: integer
          title: Id
        club_id:
          type: integer
          title: Club Id
        title:
          type: string
          title: Title
        category:
          $ref: '#/components/schemas/IssueCategory'
        status:
          $ref: '#/components/schemas/IssueStatus'
        message:
          type: string
          title: Message
      type: object
      required:
      - id
      - club_id
      - title
      - category
      - status
      - message
      title: RaiseIssueResponse
      description: Confirmation that the issue was submitted. Always returns status `OPEN`.
    RegistrationConfirmation:
      properties:
        registration_id:
          type: integer
          title: Registration Id
        event_id:
          type: integer
          title: Event Id
        event_title:
          type: string
          title: Event Title
        venue:
          type: string
          title: Venue
        starts_at:
          type: string
          format: date-time
          title: Starts At
        message:
          type: string
          title: Message
      type: object
      required:
      - registration_id
      - event_id
      - event_title
      - venue
      - starts_at
      - message
      title: RegistrationConfirmation
      description: Proof of a secured seat. `registration_id` is the unique, retrievable reference the
        student can quote instead of messaging the organiser.
    RegistrationResult:
      type: string
      enum:
      - REGISTRANT
      - PARTICIPANT
      - RUNNER_UP
      - WINNER
      title: RegistrationResult
      description: |-
        Outcome recorded against one event registration.

        * `REGISTRANT` - the default on registration. Means no outcome has been recorded, and cannot be set explicitly.
        * `PARTICIPANT`, `RUNNER_UP`, `WINNER` - set by the leader after check-in. Un-marking attendance resets the result to `REGISTRANT`.
    RemoveMemberResponse:
      properties:
        id:
          type: integer
          title: Id
          description: Id of the membership row that was deleted. It no longer resolves to anything; it
            is returned so a client can reconcile a cached roster.
        student_id:
          type: integer
          title: Student Id
        club_id:
          type: integer
          title: Club Id
        message:
          type: string
          title: Message
          examples:
          - Member removed from the club
      type: object
      required:
      - id
      - student_id
      - club_id
      - message
      title: RemoveMemberResponse
      description: Confirmation that a member was removed from a club. The membership is deleted rather
        than marked rejected, so the same student may request to join again later.
    ReplyIssueRequest:
      properties:
        reply:
          type: string
          maxLength: 2000
          minLength: 2
          title: Reply
      type: object
      required:
      - reply
      title: ReplyIssueRequest
      description: The leader's reply, which also moves the issue to `IN_PROGRESS`.
    RequestActionRequest:
      properties:
        action:
          $ref: '#/components/schemas/MembershipStatus'
      type: object
      required:
      - action
      title: RequestActionRequest
      description: The leader's decision on a join request. Must be `APPROVED` or `REJECTED`; `PENDING`
        is rejected with `422`.
    RequestActionResponse:
      properties:
        id:
          type: integer
          title: Id
        student_id:
          type: integer
          title: Student Id
        club_id:
          type: integer
          title: Club Id
        status:
          $ref: '#/components/schemas/MembershipStatus'
        message:
          type: string
          title: Message
      type: object
      required:
      - id
      - student_id
      - club_id
      - status
      - message
      title: RequestActionResponse
      description: The membership after the leader's decision has been applied.
    ResetPasswordRequest:
      properties:
        token:
          type: string
          minLength: 1
          title: Token
        password:
          type: string
          maxLength: 255
          minLength: 8
          title: Password
        confirm_password:
          type: string
          maxLength: 255
          minLength: 8
          title: Confirm Password
      type: object
      required:
      - token
      - password
      - confirm_password
      title: ResetPasswordRequest
      description: |-
        The token lifted from the `token` query parameter of the emailed reset link, plus the new password twice.

        The two password fields must match, as on signup. The current password is neither required nor accepted - possession of the link is the proof of identity. A token that is well-formed but expired, spent or of the wrong type is a `401`, not a `422`; only an empty or missing `token` fails validation here.
    ResetPasswordResponse:
      properties:
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: ResetPasswordResponse
      description: Confirmation that the password was replaced. No token is issued - the client sends the
        user to log in - and no existing access token is revoked.
    SignupRequest:
      properties:
        email:
          type: string
          maxLength: 255
          format: email
          title: Email
        full_name:
          type: string
          maxLength: 100
          minLength: 5
          title: Full Name
        password:
          type: string
          maxLength: 255
          minLength: 8
          title: Password
        confirm_password:
          type: string
          maxLength: 255
          minLength: 8
          title: Confirm Password
        role:
          $ref: '#/components/schemas/UserRole'
      type: object
      required:
      - email
      - full_name
      - password
      - confirm_password
      - role
      title: SignupRequest
      description: 'New account details. The email domain decides the outcome: a domain matching a registered
        college creates a `STUDENT` attached to it, while an unregistered domain is valid only for `CAMPUS_ADMIN`.
        Email is lower-cased and trimmed, and the two password fields must match.'
    SignupResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        message:
          type: string
          title: Message
      type: object
      required:
      - access_token
      - refresh_token
      - message
      title: SignupResponse
      description: Issued token pair for the newly created account, plus a confirmation message.
    StudentClubItem:
      properties:
        club_id:
          type: integer
          title: Club Id
        name:
          type: string
          title: Name
        category:
          type: string
          title: Category
        membership_role:
          $ref: '#/components/schemas/MembershipRole'
        joined_at:
          type: string
          format: date-time
          title: Joined At
      type: object
      required:
      - club_id
      - name
      - category
      - membership_role
      - joined_at
      title: StudentClubItem
      description: |-
        One club a student belongs to, as listed on a profile.

        Only approved memberships in active clubs appear, newest first. `joined_at` is when the membership row was created, which for an approved request is when the student applied rather than when the leader approved it. `membership_role` reveals whether the student leads the club.
    StudentProfileResponse:
      properties:
        student_id:
          type: integer
          title: Student Id
        full_name:
          type: string
          title: Full Name
        email:
          type: string
          title: Email
        profile_image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Profile Image Url
        bio:
          anyOf:
          - type: string
          - type: 'null'
          title: Bio
        interests:
          items:
            type: string
          type: array
          title: Interests
        roll_no:
          anyOf:
          - type: string
          - type: 'null'
          title: Roll No
        branch:
          anyOf:
          - type: string
          - type: 'null'
          title: Branch
        year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year
        joined_clubs:
          items:
            $ref: '#/components/schemas/StudentClubItem'
          type: array
          title: Joined Clubs
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - student_id
      - full_name
      - email
      - profile_image_url
      - bio
      - interests
      - roll_no
      - branch
      - year
      - joined_clubs
      - created_at
      title: StudentProfileResponse
      description: |-
        A student's own profile in full, returned only to that student by `GET /students/me`.

        `full_name` and `email` come from the user account and are fixed at signup. Every other editable field is null on an account that has never called `PATCH /students/me`, except `interests`, which is an empty array because the column is not nullable. `created_at` is when the student profile row was created at signup.
    TrendingClubItem:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        category:
          type: string
          title: Category
        member_count:
          type: integer
          title: Member Count
          description: Approved memberships only. The value this listing is ranked by.
        college_name:
          type: string
          title: College Name
        college_slug:
          type: string
          title: College Slug
      type: object
      required:
      - id
      - name
      - category
      - member_count
      - college_name
      - college_slug
      title: TrendingClubItem
      description: A public, unauthenticated club card for the marketing landing page. Deliberately thin
        - no description, leader details or links - and it names the college the club belongs to, since
        this is the one listing that is not scoped to a single college.
    UnreadCountResponse:
      properties:
        count:
          type: integer
          title: Count
      type: object
      required:
      - count
      title: UnreadCountResponse
      description: Number of announcements created after the caller's read watermark. Intended for a badge
        count.
    UnregisterResponse:
      properties:
        event_id:
          type: integer
          title: Event Id
        message:
          type: string
          title: Message
      type: object
      required:
      - event_id
      - message
      title: UnregisterResponse
      description: Confirmation that a registration was cancelled.
    UpdateClubRequest:
      properties:
        description:
          anyOf:
          - type: string
            maxLength: 1000
            minLength: 5
          - type: 'null'
          title: Description
        category:
          anyOf:
          - type: string
            maxLength: 50
            minLength: 2
          - type: 'null'
          title: Category
        links:
          anyOf:
          - items:
              $ref: '#/components/schemas/ClubLinkSchema'
            type: array
          - type: 'null'
          title: Links
        image_url:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Image Url
          description: Sets the banner by URL instead of uploading a file. Ignored when an `image` part
            is also sent, which always wins. Setting either one deletes the previously uploaded image.
      type: object
      title: UpdateClubRequest
      description: Editable club fields. Every field is optional and only the ones supplied are changed.
        `name` and `type` are immutable after creation. Supplying `links` replaces the whole link list;
        omitting it leaves the existing links untouched.
    UpdateEventRequest:
      properties:
        title:
          anyOf:
          - type: string
            maxLength: 150
            minLength: 3
          - type: 'null'
          title: Title
        description:
          anyOf:
          - type: string
            maxLength: 2000
            minLength: 5
          - type: 'null'
          title: Description
        venue:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 2
          - type: 'null'
          title: Venue
        starts_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Starts At
        ends_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Ends At
        capacity:
          anyOf:
          - type: integer
            maximum: 100000.0
            minimum: 1.0
          - type: 'null'
          title: Capacity
      type: object
      title: UpdateEventRequest
      description: Editable event fields. Every field is optional and only the ones supplied are changed.
        The resulting window must still end after it starts, whether the bound comes from this request
        or from the stored event.
    UpdateProfileRequest:
      properties:
        bio:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Bio
        interests:
          anyOf:
          - items:
              type: string
              maxLength: 30
              minLength: 1
            type: array
            maxItems: 10
          - type: 'null'
          title: Interests
        roll_no:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: Roll No
        branch:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Branch
        year:
          anyOf:
          - type: integer
            maximum: 5.0
            minimum: 1.0
          - type: 'null'
          title: Year
      type: object
      title: UpdateProfileRequest
      description: |-
        Editable student profile fields. Every field is optional, and this is the one request body in the API where omitting a field and sending it as `null` mean different things: an omitted field keeps its current value, while an explicit `null` clears it. An empty body is valid and changes nothing.

        `bio`, `roll_no` and `branch` are trimmed, and a value that is blank after trimming is stored as `null`. `interests` entries are trimmed and de-duplicated in the order given, case-sensitively, with the 10-item cap applied after de-duplication; sending `interests` as `null` stores an empty array rather than null.

        `full_name`, `email` and `profile_image_url` are not accepted here. They belong to the user account, and `full_name` is a claim in every issued access token.
    UpdateProfileResponse:
      properties:
        student_id:
          type: integer
          title: Student Id
        full_name:
          type: string
          title: Full Name
        email:
          type: string
          title: Email
        profile_image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Profile Image Url
        bio:
          anyOf:
          - type: string
          - type: 'null'
          title: Bio
        interests:
          items:
            type: string
          type: array
          title: Interests
        roll_no:
          anyOf:
          - type: string
          - type: 'null'
          title: Roll No
        branch:
          anyOf:
          - type: string
          - type: 'null'
          title: Branch
        year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year
        joined_clubs:
          items:
            $ref: '#/components/schemas/StudentClubItem'
          type: array
          title: Joined Clubs
        created_at:
          type: string
          format: date-time
          title: Created At
        message:
          type: string
          title: Message
      type: object
      required:
      - student_id
      - full_name
      - email
      - profile_image_url
      - bio
      - interests
      - roll_no
      - branch
      - year
      - joined_clubs
      - created_at
      - message
      title: UpdateProfileResponse
      description: The full profile as it stands after the update, identical to `StudentProfileResponse`
        plus a confirmation `message`. Returning the whole record rather than the changed fields lets a
        client replace its cached profile without a follow-up read.
    UserRole:
      type: string
      enum:
      - STUDENT
      - CAMPUS_ADMIN
      title: UserRole
      description: |-
        Account role, decided at signup and carried in the JWT `role` claim.

        * `STUDENT` - a student of a registered college. May also be a club leader, which is a per-club membership role rather than a separate account role.
        * `CAMPUS_ADMIN` - campus council admin. Onboards the college and decides club registrations.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
      description: One field-level validation failure. `loc` is the path to the offending field, for example
        `["body", "password"]`.
    Error:
      type: object
      title: Error
      description: |-
        The standard error envelope. Every `AppException` raised by the API is serialised into this single-key shape by a global exception handler.

        Two responses do not use it: a missing `Authorization` header returns `{"detail": "Not authenticated"}` and a schema validation failure returns `HTTPValidationError`.
      properties:
        message:
          type: string
          title: Message
          description: Human-readable description of what went wrong. The exact strings are catalogued
            in section 4.3 of the API description.
      required:
      - message
      examples:
      - message: Only the club leader can perform this action
    NotAuthenticated:
      type: object
      title: NotAuthenticated
      description: Returned by the bearer security scheme when the `Authorization` header is missing or
        malformed. This is the only error shape that uses `detail` for a single string rather than the
        `message` envelope.
      properties:
        detail:
          type: string
          title: Detail
          examples:
          - Not authenticated
      required:
      - detail
      examples:
      - detail: Not authenticated
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        JWT bearer authentication. Obtain a token from `POST /auth/signup` or `POST /auth/login` and send it as `Authorization: Bearer <access_token>`.

        The token carries the claims `sub`, `full_name`, `email`, `role`, `college_slug`, `iat`, `exp` and `type`. Only a token whose `type` is `access` is accepted, so neither a refresh token nor a password `reset` token can be used to call a resource endpoint.

        A missing header is rejected with `403 {"detail": "Not authenticated"}`; a token that is malformed, expired, of the wrong type, or whose `role` is not permitted on the endpoint is rejected with `401 {"message": "Invalid token"}`.

        Eight endpoints require no bearer token at all: `POST /auth/signup`, `POST /auth/login`, `POST /auth/google`, `POST /auth/forgot-password`, `POST /auth/reset-password`, `GET /clubs/public/trending`, `GET /certificates/verify/{serial}` and `GET /certificates/{serial}/file`. The reset token travels in the request body of `POST /auth/reset-password`, never in this header.
