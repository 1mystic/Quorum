      description: Details of a new event. It is always created as a `DRAFT` and must be published separately.
        `capacity` may be omitted for an uncapped event. `ends_at` must be strictly after `starts_at`,
        and naive timestamps are treated as UTC.
    CreateEventResponse:
      properties:
        id:
          type: integer
          title: Id
        club_id:
          type: integer
          title: Club Id
        title:
          type: string
          title: Title
        status:
