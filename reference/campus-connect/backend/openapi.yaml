      summary: Request to join a club
      description: |-
        **User story 2.3 - Request to Join a Club** (Epic 2 - Club Discovery and Membership)

        > As a student, I want to send a formal join request to a club with one action on the platform, so that my request reaches the club leader immediately without needing to DM anyone or follow up manually.

        Submits a join request in a single call - the platform replacement for finding an Instagram page, sending a DM, filling a form and then chasing a WhatsApp invite.

        Creates a `PENDING` membership that surfaces immediately in the leader's queue at `GET /clubs/{club_id}/requests`. The student tracks it through `GET /clubs/me?role=MEMBER&status=PENDING`, and is notified with `JOIN_APPROVED` or `JOIN_REJECTED` when the leader decides - so the request is never silent.

        **Access.** `STUDENT` token. Any verified student of the club's college.

        **Notes.**

        * One request per student per club, enforced by a unique constraint. Re-requesting after a rejection also returns `409`; the prior membership row still exists.
        * Two concurrent requests race safely: the loser is caught at the database constraint and receives the same `409`.
        * Only `ACTIVE` clubs accept joins.
      operationId: join_club_clubs__club_id__join_post
