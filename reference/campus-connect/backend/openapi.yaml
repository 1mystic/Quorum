  /events/{event_id}/results:
    patch:
      tags:
      - Events
      summary: Declare the event results
      description: |-
        **User story 3.5 - Set a Result for Each Attendee** (Epic 3 - Event Lifecycle)

        > As a club leader, I want to assign a result - Winner, Runner-up, or Participant - to each student who attended, so that outcomes are permanently recorded and not lost in WhatsApp messages after the event ends.

        Closes the event out in a single call. The leader names the winner and the runner-up; every other checked-in attendee is already a `PARTICIPANT` from the moment attendance was marked, so nothing further needs to be sent for them.

        This is what makes results permanent. The record lives on the student's profile through `GET /events/me/results` instead of in a message that scrolls away, which is the difference between a participation history that survives the year and one that nobody can reconstruct.

        **Both nominees must be checked in.** Naming a student who was never marked present returns `400 Result can only be set for attendees who were checked in`.

        **This call is final.** Once results are declared the event is frozen: a second declaration returns `409`, and so does any later attempt to change attendance through `PATCH .../attendance`. Correcting a mistake after this point is not possible through the API.

        **Side effects.** A `RESULT_POSTED` notification is written for every checked-in attendee, and one certificate job is queued per attendee - which is where all Epic 5 certificates come from.

        **Access.** `STUDENT` token **and** a `LEADER` membership on the hosting club.

        **Notes.**

        * `winner_registration_id` and `runner_up_registration_id` must differ; sending the same id twice is a `422`.
        * Exactly one winner and one runner-up. The API does not support ties or multiple winners.
        * Attendees who were never checked in receive nothing - no result change, no notification and no certificate.
        * `certificates_queued` counts the jobs handed to the background worker, not certificates confirmed as stored. Certificates appear in `GET /certificates/me` once each job finishes, typically within seconds.
        * `participants` is the number of checked-in attendees other than the two nominees.
        * Results are committed before the certificate jobs are queued, so a failure while rendering a PDF never rolls back the declared results.
      operationId: declare_results_events__event_id__results_patch
      x-epic: Epic 3 - Event Lifecycle
      x-user-story: '3.5'
      x-user-story-title: Set a Result for Each Attendee
      x-required-role:
      - STUDENT
      x-required-club-role: LEADER
      parameters:
      - name: event_id
        in: path
        required: true
        description: Id of an event hosted by a club the caller leads.
        schema:
          type: integer
          title: Event Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclareResultsRequest'
      responses:
        '200':
          description: Results declared. Every checked-in attendee has been notified and a certificate
            has been queued for each of them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclareResultsResponse'
        '400':
          description: |-
            The request is well formed but the target record is in a state that forbids it.

            * `Result can only be set for attendees who were checked in` - The winner or the runner-up is not checked in. Mark attendance first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_checked_in:
                  summary: Result can only be set for attendees who were checked in
                  value:
                    message: Result can only be set for attendees who were checked in
        '401':
          description: |-
            The bearer token is present but unusable, or the account role is not permitted here.

            * `Invalid token` - The token is malformed, expired, not an `access` token, or its `role` is not permitted on this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
