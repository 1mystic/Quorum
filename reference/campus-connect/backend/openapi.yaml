tags:
- name: Auth
  description: |-
    Account creation, login and password recovery. The only public endpoints in the API, apart from certificate verification. Signup and login both return an access token and a refresh token.

    Signup is also the point at which a user's role is decided: an email whose domain matches a registered college produces a `STUDENT`, while an unregistered domain produces a `CAMPUS_ADMIN` who is expected to complete college onboarding next.

    Password recovery is a two-call flow across two clients. `POST /auth/forgot-password` emails a link carrying a short-lived `reset` token, and `POST /auth/reset-password` exchanges that token plus a new password for a usable account. Nothing about the reset is readable from the API - a request for an unregistered address is indistinguishable from one for a real account.

    **Signup and login implement user story 1.2. Password recovery is not part of the Milestone-1 story set.**
- name: College Onboarding
  description: |-
    Registration of an institution and its verified student email domain. Run once per college by the campus council admin, immediately after admin signup.

    Onboarding is what makes every later request tenant-scoped: the `email_suffix` routes future signups to this college, and the college id derived from it filters every club, event, announcement and issue query.

    **Implements user story 1.1.**
- name: Students
  description: |-
    Student profiles: the academic and personal details a student maintains about themselves, and the read-only view other members of the same college get of them.

    A student row is created empty by signup, which collects only name, email and password. Every profile field - `bio`, `interests`, `roll_no`, `branch`, `year` - starts null or empty and is filled in later through `PATCH /students/me`. Until a student does that, the `roll_no`, `branch` and `year` columns that appear on participant lists and club head contact details are blank.

    `PATCH /students/me` is a true partial update: a field omitted from the body keeps its current value, while a field sent explicitly as `null` is cleared. This is the only endpoint in the API with that distinction, so clients should send the changed fields alone rather than a whole profile.

    Names, emails and profile images live on the user account rather than the student profile and are fixed at signup. They are not editable here, because a name is embedded as a claim in every issued access token and changing it would leave live tokens disagreeing with the database.

    **Profile management is not part of the Milestone-1 story set.**
- name: Clubs
  description: |-
    The club directory, club profiles, the club registration and approval workflow, and membership management.

    Club status lifecycle: `PENDING` -> `ACTIVE` or `REJECTED` on the admin's decision, and `ARCHIVED` when a leader deletes the club. Only `ACTIVE` clubs are visible to students, accept join requests, or can host events and announcements.

    Membership status lifecycle: `PENDING` on request -> `APPROVED` or `REJECTED` by the leader. Only an `APPROVED` membership grants event registration and the announcement feed.

    **Implements user stories 2.1 - 2.6.**
- name: Events
  description: |-
    The full event lifecycle: creation, publication, registration, attendance and results.

    Event status lifecycle: `DRAFT` on creation -> `PUBLISHED` when the leader publishes -> `CANCELLED` if plans change. A `DRAFT` event is visible only to the leaders of the hosting club and to campus admins; registration requires `PUBLISHED`.

    Registration result lifecycle: `REGISTRANT` on sign-up -> `WINNER`, `RUNNER_UP` or `PARTICIPANT` once the leader records an outcome, which is permitted only after the student has been checked in.

    **Implements user stories 3.1 - 3.7.**
- name: Announcements
  description: |-
    One-to-many club communication. A leader posts once and every approved member of the club receives it in a single consolidated feed, replacing repeated messages across WhatsApp, Instagram and email.

    Unread state is tracked with a single `announcements_seen_at` watermark per student rather than per-announcement read receipts: anything created after the watermark is `unread: true`, and `POST /announcements/read-all` moves the watermark to now.

    **Implements user stories 4.1 and 4.2.**
- name: Issues
  description: |-
    In-platform query tracking, so that a member's question about a registration, a membership or a certificate is recorded and answerable instead of arriving as a direct message to the leader.

    Issue status lifecycle: `OPEN` on submission -> `IN_PROGRESS` when the leader replies -> `RESOLVED` when the leader closes it. A `RESOLVED` issue is terminal and accepts neither further replies nor a second resolve.

    **Implements user stories 4.3 and 4.4.**
- name: Notifications
  description: |-
    The student's inbox of platform events. Notifications are never created directly by a client; they are written as a side effect of a leader approving a join request, a student registering for an event, or a leader recording a result.

    Unread state here is per-notification (`is_read`), unlike announcements which use a single watermark.

    **Cross-cutting: supports stories 2.3, 2.4, 3.2 and 3.5.**
- name: Certificates
  description: |-
    Participation certificates: one PDF per checked-in attendee, generated automatically when a leader declares results, addressable by a unique serial, downloadable by its owner and verifiable by anyone.

    No client ever creates a certificate. `PATCH /events/{event_id}/results` queues one background job per checked-in attendee; each job renders the PDF from the template matching that attendee's result, uploads it to object storage as `certificates/{serial}.pdf`, writes the certificate row and sends a `CERTIFICATE_ISSUED` notification. A student's first sight of a certificate is therefore the notification, not a response body.

    Serials take the form `CC-<abbreviated event title>-<year>-<5 digits>`, for example `CC-HAC-2026-04213`, and are printed on the certificate itself next to a QR code pointing at the public verification page. The serial is the only identifier in this tag - certificates are never addressed by numeric id.

    Storage is private. Both `GET /certificates/me` and `GET /certificates/{serial}/download` return a time-limited signed URL rather than a permanent one, so a link that leaks stops working within the hour.

    **Implements user stories 5.1 - 5.3.**
- name: Leaderboard
  description: |-
    A monthly ranking of the `ACTIVE` clubs in the caller's college by activity. Every student sees the same board for their own college; a club from another college never appears.

    Each club's activity score is recomputed on every request from events, membership growth, attendance and resolved issues recorded since the first of the current month - there is no stored total and no scheduled reset job. On the first of each month the counting window rolls forward and every score effectively returns to zero.

    Score = `events_held x 40` + `new_members x 5` + `issues_resolved x 10` + an attendance bonus of up to 200. Events held counts this month's `PUBLISHED` events; new members counts `APPROVED` memberships joined this month; issues resolved counts issues moved to `RESOLVED` this month. The attendance bonus is the club's average per-event check-in rate this month (check-ins / registrations, averaged over events that had at least one registration, so an empty event neither helps nor hurts) multiplied by 200. The final score is an integer.

    Clubs with no activity this month are included with a score of 0 and ranked last. Ties break by new-member count, then club name, so the ordering is stable.

    **Implements Epic 7 - Club Activity Leaderboard.**
- name: AI Assistant
  description: |-
    Conversational club and event discovery. A student describes what they are interested in and the assistant answers in prose, with cards for the clubs and events it named.

    One endpoint, `POST /ai/chat`, running one turn of a bounded tool-calling loop. The conversation is stateless server-side: the client sends the history it holds and receives one reply, so there is no session to create or expire.

    The model reads the platform through a fixed set of read-only tools that call the same services as the equivalent HTTP endpoints, with the same college scoping. There is no tool that writes, so the assistant cannot join a club, register for an event or post anything on a student's behalf - when asked, it explains how to do it in the app instead.

    Every entity named in a reply must have come from a tool result in that same turn; an output gate removes any reference that did not, which is why `items` can be trusted as the set of real records behind the prose.

    The endpoint never fails because the model or the database is unavailable. It answers from the deterministic recommender when Claude is unreachable (`degraded: true`) and from a built-in sample campus when the live data is not (`offline: true`), and reports which happened rather than returning an error.

    **Implements Epic 6 - AI-Powered Club Discovery.**
paths:
  /auth/signup:
    post:
      tags:
      - Auth
      summary: Create an account
      description: |-
        **User story 1.2 - Sign Up and Log In** (Epic 1 - Platform Foundation)

        > As a registered user (new student or club leader), I want to create an account with my college email and log in with one set of credentials, so that I am recognized as a verified member of my institution without any manual approval step.

        Creates an account and returns a usable token pair immediately - there is no email confirmation step and no manual approval queue.

        **The email domain decides the outcome**, which is how a student is verified as belonging to their institution without anyone vetting them by hand:

        | `role` sent | Email domain | Result |
        |---|---|---|
        | `STUDENT` | Matches a registered college | Account created and attached to that college, plus a student profile. `college_slug` is set in the token |
        | `STUDENT` | Matches no college | `404 College not registered` |
        | `CAMPUS_ADMIN` | Matches no college | Account created with a campus admin profile and no college yet. Onboarding is the expected next call |
        | `CAMPUS_ADMIN` | Matches a registered college | `409 College already registered` - a college may have only one admin signup route |

        **Access.** Public. No token required.

        **Notes.**

        * `email` is trimmed and lower-cased before the uniqueness check, so `A@X.COM` and `a@x.com` are the same account.
        * The password is hashed before storage; it is never returned by any endpoint.
        * A `CAMPUS_ADMIN` created here has no college until `POST /college/onboarding` succeeds. Until then, every college-scoped read returns `404 College not registered`.
      operationId: signup_auth_signup_post
      x-epic: Epic 1 - Platform Foundation
      x-user-story: '1.2'
      x-user-story-title: Sign Up and Log In
      x-required-role:
      - public
      x-required-club-role: none
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      responses:
        '200':
          description: Account created. Returns an access token and a refresh token, ready to use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '404':
          description: |-
            The record does not exist, belongs to another college, or is not visible to the caller.

            * `College not registered` - `role` is `STUDENT` but no registered college owns that email domain. The college must be onboarded first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                college_missing:
                  summary: College not registered
                  value:
                    message: College not registered
        '409':
          description: |-
            The request conflicts with a record that already exists.

            * `Email already registered` - An account already exists for this email.
            * `College already registered` - `role` is `CAMPUS_ADMIN` but this email domain is already registered to a college.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                email_taken:
                  summary: Email already registered
                  value:
                    message: Email already registered
                college_taken:
                  summary: College already registered
                  value:
                    message: College already registered
        '422':
          description: The request body, query string or path parameters failed schema validation. Produced
            by the framework before the handler runs, so it uses the `detail` key rather than the `message`
            envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Something went wrong
                  value:
                    message: Something went wrong
  /auth/login:
    post:
      tags:
      - Auth
      summary: Log in
      description: |-
        **User story 1.2 - Sign Up and Log In** (Epic 1 - Platform Foundation)

        > As a registered user (new student or club leader), I want to create an account with my college email and log in with one set of credentials, so that I am recognized as a verified member of my institution without any manual approval step.

        Exchanges credentials for a fresh token pair. The same endpoint serves students, club leaders and campus admins - the returned token's `role` claim, not a separate login route, is what distinguishes them.

        **Access.** Public. No token required.

        **Notes.**

        * An unknown email and a wrong password both return the same `401 Incorrect email or password`, so the response cannot be used to enumerate registered accounts.
        * The token carries `college_slug`, letting a client scope its UI without an extra call.
      operationId: login_auth_login_post
      x-epic: Epic 1 - Platform Foundation
      x-user-story: '1.2'
      x-user-story-title: Sign Up and Log In
      x-required-role:
      - public
      x-required-club-role: none
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Authenticated. Returns an access token and a refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: |-
            The account exists but the password does not match.

            * `Incorrect email or password` - A matching account was found but the supplied password is wrong (or the account has no password because it was created through Google).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                bad_credentials:
                  summary: Incorrect email or password
                  value:
                    message: Incorrect email or password
        '404':
          description: |-
            No account could be signed in, and login never creates one.

            * `College not registered` - No account exists for this email and its domain matches no registered college.
            * `Account does not exist` - The email's college is registered, but no account has been created for it yet. Sign up first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                college_not_registered:
                  summary: College not registered
                  value:
                    message: College not registered
                account_not_exist:
                  summary: Account does not exist
                  value:
                    message: Account does not exist
        '422':
          description: The request body, query string or path parameters failed schema validation. Produced
            by the framework before the handler runs, so it uses the `detail` key rather than the `message`
            envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Something went wrong
                  value:
                    message: Something went wrong
  /auth/google:
    post:
      tags:
      - Auth
      summary: Sign in with Google
      description: |-
        **User story 1.2 - Sign Up and Log In** (Epic 1 - Platform Foundation)

        > As a registered user (new student or club leader), I want to sign in with my Google account, so that I can join the platform without creating and remembering another password.

        Both sign-up and log-in run through this one endpoint; the `intent` field in the body decides which. The client runs Google Sign-In, obtains an ID token, and posts it here. The server verifies the token against Google and returns the same access + refresh token pair every other auth route issues. `is_new_user` tells the client whether an account was just created.

        `intent` defaults to `login`. On `login`, an existing account is signed in and nothing is ever created - a caller with no account gets a `404`, never a silent sign-up. On `signup`, a new account is created when none exists (this is the only path that creates one). An already-existing account is signed in under either intent.

        Role is not sent by the client: on `signup` it is derived from the email exactly as password signup derives it. An email whose domain matches a registered college produces a `STUDENT` scoped to that college; any other verified email produces a `CAMPUS_ADMIN` who is expected to complete college onboarding next.

        **Access.** Public. No token required; the Google ID token in the body is the credential.

        **Notes.**

        * The email must be verified on the Google side (`email_verified`); an unverified Google email is a `403`.
        * `intent: login` for an email with no account returns `404` - `College not registered` if the email's domain matches no college, otherwise `Account does not exist`. It mirrors `POST /auth/login`.
        * If an account with that email already exists from password signup, this links the Google identity to it and logs in - it never creates a duplicate. That account keeps its password and can still log in either way.
        * A Google-only account has no password, so `POST /auth/login` will reject it and `POST /auth/forgot-password` sends nothing for it.
      operationId: google_auth_auth_google_post
      x-epic: Epic 1 - Platform Foundation
      x-user-story: '1.2'
      x-user-story-title: Sign Up and Log In
      x-required-role:
      - public
      x-required-club-role: none
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
        required: true
      responses:
        '200':
          description: Authenticated. Returns an access token, a refresh token, and whether the account was just created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthResponse'
        '401':
          description: |-
            The Google ID token could not be trusted.

            * `Invalid Google token` - The token is malformed, expired, not issued by Google, or not issued for this application's client id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_google_token:
                  summary: Invalid Google token
                  value:
                    message: Invalid Google token
        '403':
          description: |-
            The Google identity is valid but not usable for sign-in.

            * `Google account email is not verified` - The token's `email_verified` claim is false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                email_not_verified:
                  summary: Google account email is not verified
                  value:
                    message: Google account email is not verified
        '404':
          description: |-
            `intent: login` for an email that has no account. Login never creates one.

            * `College not registered` - The email's domain matches no registered college.
            * `Account does not exist` - The college is registered, but no account has been created for this email. Send `intent: signup` to create one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                college_not_registered:
                  summary: College not registered
                  value:
                    message: College not registered
                account_not_exist:
                  summary: Account does not exist
                  value:
                    message: Account does not exist
        '422':
          description: The request body, query string or path parameters failed schema validation. Produced
            by the framework before the handler runs, so it uses the `detail` key rather than the `message`
            envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '503':
          description: |-
            Google sign-in is not available on this deployment.

            * `Google sign-in is not configured` - The server has no `GOOGLE_CLIENT_ID` set, so it cannot verify Google tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_configured:
                  summary: Google sign-in is not configured
                  value:
                    message: Google sign-in is not configured
        '500':
          description: Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Something went wrong
                  value:
                    message: Something went wrong
  /auth/forgot-password:
    post:
      tags:
      - Auth
      summary: Request a password reset link
      description: |-
        Starts password recovery by emailing a single-use reset link to the address supplied. Added after sprint 1 in response to user feedback; it is not part of the Milestone-1 story set and carries no user story.

        The response is deliberately uninformative. Whether the address belongs to an account or to nobody at all, the call returns the same `200` and the same message, so this endpoint cannot be used to discover which emails are registered. A client must not branch on the response - it can only tell the user to check their inbox.

        The email is sent from a background task after the response is written, so a slow or unreachable mail server delays nothing and fails nothing. The corollary is that a delivery failure is invisible to the caller: it is logged server side, and the user's only remedy is to request another link.

        **Access.** Public. No token required.

        **Notes.**

        * `email` is trimmed and lower-cased before lookup, matching signup, so `A@X.COM` finds the account created as `a@x.com`.
        * The link points at `{FRONTEND_URL}/reset-password?token=<token>` and is valid for 15 minutes.
        * The token is a `reset` token, not an access token. It is refused by every other endpoint in this API.
        * Requesting a second link does not invalidate the first. Both remain usable until one is spent or they expire, because nothing about the reset is stored server side.
        * Nothing is written to the database by this call - the account is untouched until the reset itself succeeds.
      operationId: forgot_password_auth_forgot_password_post
      x-required-role:
      - public
      x-required-club-role: none
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '200':
          description: |-
            Accepted. Returned identically for a registered and an unregistered address, so it confirms only that the request was understood, never that the account exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
              examples:
                sent:
                  summary: Always the same answer
                  value:
                    message: If that email is registered, a password reset link has been sent to it
        '422':
          description: |-
            The request body failed schema validation. Produced by the framework before the handler runs, so it uses the `detail` key rather than the `message` envelope.

            * `email` is missing, malformed, or longer than 255 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: |-
            Unhandled server error.

            A mail server that is down does **not** produce this. Sending happens after the response, so an SMTP failure is logged and never surfaces to the client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Something went wrong
                  value:
                    message: Something went wrong
  /auth/reset-password:
    post:
      tags:
      - Auth
      summary: Set a new password from a reset link
      description: |-
        Completes password recovery. Takes the token from the emailed link and a new password, and writes the new password to the account. Added after sprint 1 in response to user feedback; it is not part of the Milestone-1 story set and carries no user story.

        The current password is not required and cannot be supplied - possession of the emailed link is the entire proof of identity, which is why the link is short-lived and single-use.

        **A link works exactly once.** The token carries a fingerprint of the password hash it was minted against. Resetting the password changes that hash, so the fingerprint in every outstanding link for the account stops matching and every one of them - including the link just used - is rejected from that moment on. There is no stored token to revoke and no `used` flag anywhere.

        **Every failure is the same `401`.** Expired, tampered with, an access token pasted in by mistake, or a link already spent - all four return `Invalid token`, so the response reveals nothing about which of them happened.

        **Access.** Public. No bearer token; the reset token travels in the request body, not in the `Authorization` header.

        **Notes.**

        * No session is issued. On success the client sends the user to log in with the new password.
        * No token is returned and none is invalidated: access tokens issued before the reset stay valid until they expire on their own.
        * `password` and `confirm_password` must match, exactly as on signup.
        * Reusing the previous password is accepted. The only effect is that outstanding reset links keep working, because the hash - and so the fingerprint - is unchanged.
      operationId: reset_password_auth_reset_password_post
      x-required-role:
      - public
      x-required-club-role: none
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '200':
          description: Password replaced. The link is now spent, and the user can log in with the new password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
              examples:
                reset:
                  summary: Password reset successfully
                  value:
                    message: Password reset successfully, please log in with your new password
        '401':
          description: |-
            The reset token cannot be honoured. All four causes below are reported identically, so a client cannot tell them apart and must offer the same remedy - request a new link.

            * `Invalid token` - The token is malformed or was tampered with.
            * `Invalid token` - The token expired. Links live 15 minutes.
            * `Invalid token` - The token is not of type `reset`, for example an access token sent in its place.
            * `Invalid token` - The link has already been used, or the password has changed since it was issued, so its password fingerprint no longer matches. The account referenced by the token no longer existing is reported the same way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_token:
                  summary: Invalid token
                  value:
                    message: Invalid token
        '422':
          description: |-
            The request body failed schema validation. Produced by the framework before the handler runs, so it uses the `detail` key rather than the `message` envelope.

            * `password` or `confirm_password` is shorter than 8 or longer than 255 characters.
            * `password` and `confirm_password` do not match.
            * `token` is missing or empty. A token that is present but unusable is a `401`, not a `422`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Something went wrong
                  value:
                    message: Something went wrong
  /college/onboarding:
    post:
      tags:
      - College Onboarding
      summary: Register a college and its verified email domain
      description: |-
        **User story 1.1 - Register a College on the Platform** (Epic 1 - Platform Foundation)

        > As a Campus Council Admin, I want to register my institution and set the official student email domain, so that students from my college are automatically verified and routed to their institution's space on signup.

        Creates the college record and binds the calling admin to it.

        This is the call that opens the institution to its students: from here on, any signup whose email domain equals `email_suffix` is automatically recognised as a verified student of this college and routed into its isolated space. It is also what makes tenancy work - the college id resolved from the caller is the filter applied to every club, event, announcement and issue query in the rest of the API.

        **Access.** `CAMPUS_ADMIN` token. Called once per institution, immediately after admin signup.

        **Notes.**

        * `email_suffix` is trimmed and lower-cased, and must be a bare domain such as `knit.ac.in` - no `@`, no scheme, no path.
        * `slug` is generated server-side from the first label of the domain (`knit.ac.in` -> `knit`). If that slug is taken, a counter is appended (`knit-2`).
        * The calling admin's account is updated to point at the new college as part of the same operation.
      operationId: onboarding_college_onboarding_post
      x-epic: Epic 1 - Platform Foundation
      x-user-story: '1.1'
      x-user-story-title: Register a College on the Platform
      x-required-role:
      - CAMPUS_ADMIN
      x-required-club-role: none
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollegeOnboardingRequest'
        required: true
      responses:
        '200':
          description: College registered. The admin account is now attached to it and students on this
            domain can sign up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollegeOnboardingResponse'
        '401':
          description: |-
            The bearer token is present but unusable, or the account role is not permitted here.

            * `Invalid token` - The token is malformed, expired, not an `access` token, or its `role` is not permitted on this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_token:
                  summary: Invalid token
                  value:
                    message: Invalid token
        '403':
          description: |-
            The caller is authenticated but not permitted, or the resource state blocks the action.

            * **Missing credentials** - the `Authorization` header is absent or is not a bearer token. This case is produced by the security scheme before application code runs and is the one error that uses the `detail` key: `{"detail": "Not authenticated"}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthenticated'
              examples:
                missing_credentials:
                  summary: No Authorization header
                  value:
                    detail: Not authenticated
        '409':
          description: |-
            The request conflicts with a record that already exists.

            * `College already registered` - A college is already registered for this `email_suffix`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                college_taken:
                  summary: College already registered
                  value:
                    message: College already registered
        '422':
          description: The request body, query string or path parameters failed schema validation. Produced
            by the framework before the handler runs, so it uses the `detail` key rather than the `message`
            envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
