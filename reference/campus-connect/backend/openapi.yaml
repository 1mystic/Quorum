          type: integer
          title: Club Id
        club_name:
          type: string
          title: Club Name
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
        venue:
          type: string
          title: Venue
        starts_at:
          type: string
          format: date-time
          title: Starts At
        ends_at:
          type: string
          format: date-time
          title: Ends At
        capacity:
          anyOf:
          - type: integer
          - type: 'null'
          title: Capacity
        registration_count:
          type: integer
          title: Registration Count
        seats_left:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seats Left
        status:
          $ref: '#/components/schemas/EventStatus'
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
        created_at:
