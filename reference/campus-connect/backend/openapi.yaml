        Submits a tracked query to a club's leaders, created with status `OPEN`.

        The value over a direct message is that the query is *recorded*: it lands in the leader's queue with an id, and the student can follow it through `GET /issues` instead of wondering whether a DM was seen.

        `category` routes the query, and `event_id` may be attached to tie a question to a specific event - which is what makes a `CERTIFICATE` or `EVENT` query answerable without a back-and-forth to establish what it is about.

