# Campus Connect API - OpenAPI 3.1 specification
# Team 003 (Nexmind) - BSCS3001 Software Engineering Project, May 2026
# Covers Epics 1-5 of the Milestone-1 user stories.
openapi: 3.1.0
info:
  title: Campus Connect API
  summary: Student club management for higher education institutions - student profiles, club discovery,
    membership, the event lifecycle, results, certificates and member communication.
  description: |-
    Campus Connect is a single platform for student club management in higher education
    institutions. It replaces the scatter of Instagram DMs, WhatsApp groups, Google Forms and
    spreadsheets that campus clubs currently run on, and connects student profiles, club
    discovery, membership, the event lifecycle, results, verifiable certificates and member
    communication into one auditable workflow.

    This document is the complete reference for the backend HTTP API: every endpoint, the user
    story it implements, the roles allowed to call it, and every error it can return.

    ---

    ## 1. Conventions

    | Aspect | Rule |
    |---|---|
    | Transport | HTTPS, JSON request and response bodies (`application/json`) |
    | Success status | All endpoints return `200 OK` on success, including creates |
    | Timestamps | ISO-8601, UTC. Naive datetimes sent by a client are interpreted as UTC |
    | Enums | Sent and returned as UPPER_SNAKE_CASE strings |
    | Collections | Return a JSON array; an empty result is `[]`, never `404` |
    | Pagination | `limit` (1-100, default 50) and `offset` (>= 0) where supported |
    | Tenancy | Every request is scoped to the caller's college. Cross-college records are reported as `404`, never as `403`, so that one college cannot probe another's data |

    ---

    ## 2. Authentication

    The API uses stateless **JWT bearer tokens**. There are no sessions and no cookies.

    1. `POST /auth/signup` or `POST /auth/login` returns an `access_token` and a `refresh_token`.
    2. Send the access token on every other endpoint as `Authorization: Bearer <access_token>`.

    **Token properties**

    | Property | Value |
    |---|---|
    | Algorithm | HS256 (server-configured) |
    | Access token lifetime | 15 minutes |
    | Refresh token lifetime | 7 days |
    | Claims | `sub` (user id), `full_name`, `email`, `role`, `college_slug`, `iat`, `exp`, `type` |

    A token whose `type` claim is not `access` is rejected, so a refresh token cannot be used to
    call a resource endpoint. There is no refresh exchange endpoint in this release; a client
    that holds an expired access token must log in again.

    **Password reset tokens.** A user who cannot log in recovers the account through a third
    token type, `reset`, which is never returned in a response body - it is minted by
    `POST /auth/forgot-password` and delivered inside a link in an email.

    | Property | Value |
    |---|---|
    | Lifetime | 15 minutes |
    | Claims | `sub` (user id), `email`, `pwd`, `iat`, `exp`, `type` |
    | Delivery | Emailed link only, never in an API response |
    | Accepted by | `POST /auth/reset-password` and nothing else |

    Two properties follow from the claims. Because the same `type` check that rejects a refresh
    token also rejects a `reset` token, a link intercepted from an inbox cannot be used to call
    any resource endpoint - it can only reach the reset route. And because `pwd` is a
    fingerprint of the account's current password hash, which necessarily changes when the
    password is written, a link stops working the moment it is used once. Nothing is stored
    server side and no token is revoked; expiry and the fingerprint are the entire mechanism.

    ---

    ## 3. Role and permission model

    Authorisation is enforced in two layers. Understanding both is required to read the
    per-endpoint **Access** notes correctly.

    ### Layer 1 - account role (checked at the route)

    The `role` claim in the JWT must be in the endpoint's allowed scopes, or the request is
    rejected with `401`.

    | Role | Who it is | Created by |
    |---|---|---|
    | `CAMPUS_ADMIN` | Campus council admin / student affairs coordinator | Signing up with an email whose domain is not yet registered |
    | `STUDENT` | Student, club member or club leader | Signing up with an email whose domain matches a registered college |

    ### Layer 2 - club role (checked in the service layer)

    `STUDENT` is a single account role; being a **club leader** is not a separate account type
    but a `LEADER` membership row on one specific club. Leader-only endpoints therefore accept a
    `STUDENT` token at the route and then verify leadership of the target club, returning `403
    Only the club leader can perform this action` when it is missing.

    | Club role | Granted by |
    |---|---|
    | `LEADER` | Creating the club. Automatically inserted as an `APPROVED` `LEADER` membership |
    | `MEMBER` | Requesting to join and being approved by a leader |

    ### Permission matrix

    | Capability | CAMPUS_ADMIN | Club LEADER | Club MEMBER | Any student |
    |---|---|---|---|---|
    | Onboard a college | Yes | No | No | No |
    | Approve / reject club registrations | Yes | No | No | No |
    | Browse clubs and events | Yes (all statuses) | Yes | Yes | Yes (ACTIVE / PUBLISHED only) |
    | Create a club | No | n/a | n/a | Yes |
    | Edit / archive a club | No | Yes (own club) | No | No |
    | Approve / reject join requests | No | Yes (own club) | No | No |
    | Create, edit, publish, cancel events | No | Yes (own club) | No | No |
    | Register for an event | No | Yes | Yes | No - approved membership required |
    | Mark attendance, set results | No | Yes (own club) | No | No |
    | Post / pin / delete announcements | No | Yes (own club) | No | No |
    | Read the announcement feed | No | Yes | Yes | Yes (joined clubs only) |
    | Raise an issue | No | Yes | Yes | Yes |
    | Reply to / resolve issues | No | Yes (own club) | No | No |

    `CAMPUS_ADMIN` is an oversight role, not a super-user: it can read every club and event in
    its college and decide club registrations, but it cannot create clubs, run events or post
    announcements. Those are student-owned actions.

    ---

    ## 4. Error handling

    ### 4.1 Error envelope

    Every application error is raised as an `AppException` subclass and serialised by a single
    global handler into one consistent shape:

    ```json
    { "message": "Only the club leader can perform this action" }
    ```

    Two responses do **not** use this envelope, because they are produced by the framework
    before application code runs. Clients must handle both keys:

    | Case | Status | Body |
    |---|---|---|
    | `Authorization` header missing or malformed | `403` | `{"detail": "Not authenticated"}` |
    | Request body / query / path failed schema validation | `422` | `{"detail": [ ... ]}` (see `HTTPValidationError`) |

    ### 4.2 Status code semantics

    | Status | Meaning in this API |
    |---|---|
    | `400` | The request is well-formed but the target record is in a state that forbids it |
    | `401` | Token is missing from application scope, invalid, expired, of the wrong type, or the account role is not permitted on this endpoint |
    | `403` | Caller is authenticated but not permitted, or the resource is in a state that blocks the action |
    | `404` | Record does not exist, or exists in another college, or is not visible to the caller |
    | `409` | Conflict with an existing record - duplicate signup, duplicate join, duplicate registration, or capacity exhausted |
    | `422` | Schema validation failure |
    | `500` | Unhandled server error - `{"message": "Something went wrong"}` |

    Note on `401` vs `403`: a token that is absent entirely is rejected by the bearer scheme with
    `403 Not authenticated`, while a token that is present but unusable - including a valid token
    whose `role` is not allowed on the endpoint - is rejected with `401 Invalid token`. The role
    mismatch is deliberately reported as `401` and not `403` so that role probing is not
    distinguishable from token failure.

    ### 4.3 Complete error catalogue

    Every error the API can emit, with the exact message string returned.

    | Exception | Status | `message` | Raised when |
    |---|---|---|---|
    | `UserAlreadyExistError` | 409 | `Email already registered` | Signup with an email already in use |
    | `CollegeNotFoundError` | 404 | `College not registered` | Student signup whose email domain matches no college, an authenticated user has no college attached, or a login (`POST /auth/login` or `POST /auth/google` with `intent: login`) for an email with no account whose domain matches no college |
    | `CollegeAlreadyExistError` | 409 | `College already registered` | Admin signup or onboarding for a domain that is already registered |
    | `AccountNotExistError` | 404 | `Account does not exist` | Login (`POST /auth/login` or `POST /auth/google` with `intent: login`) for an email whose college is registered but that has no account yet. Login never creates one - sign up first |
    | `IncorrectCredentialError` | 401 | `Incorrect email or password` | Login against an existing account with the wrong password, or against a Google-only account that has no password |
    | `AuthenticationError` | 401 | `Invalid token` | Token is malformed, expired, or not of the type the endpoint requires. Also raised by `POST /auth/reset-password` when the link is not a `reset` token, when its subject no longer exists, or when its `pwd` fingerprint no longer matches - that is, when the link has already been used |
    | `AuthorizationError` | 401 | `Invalid token` | Token is valid but its `role` is not in the endpoint's scopes |
    | `InvalidGoogleTokenError` | 401 | `Invalid Google token` | `POST /auth/google` was given a Google ID token that is malformed, expired, not issued by Google, or not issued for this application's client id |
    | `EmailNotVerifiedError` | 403 | `Google account email is not verified` | `POST /auth/google` with a Google identity whose `email_verified` claim is false |
    | `GoogleAuthNotConfiguredError` | 503 | `Google sign-in is not configured` | `POST /auth/google` on a deployment that has no `GOOGLE_CLIENT_ID` set |
    | `StudentNotFoundError` | 404 | `Student profile not found` | A student-only action is attempted by a user with no student profile. Also raised by `GET /students/{student_id}` when the id is unknown, when the student belongs to another college, or when the caller has no college attached |
    | `ClubNotFoundError` | 404 | `Club not found` | Club id does not exist, belongs to another college, or is not `ACTIVE` when viewed by a student |
    | `ClubNotActiveError` | 403 | `Club is not active` | Joining, posting to, or raising an issue against a club that is `PENDING`, `REJECTED` or `ARCHIVED` |
    | `NotClubLeaderError` | 403 | `Only the club leader can perform this action` | A leader-only action attempted by a non-leader |
    | `AlreadyMemberError` | 409 | `You already have a membership or request for this club` | Duplicate join request, including two concurrent requests racing |
    | `MembershipNotFoundError` | 404 | `Membership request not found` | Membership id unknown, or it belongs to a different club |
    | `ClubActionNotAllowedError` | 403 | `This action is not allowed` | Default. Overridden with `Club is not pending approval` or `Request has already been handled` |
    | `InvalidStatusFilterError` | 422 | `Invalid status filter` | Overridden with a message naming the allowed values for the given `role` |
    | `EventNotFoundError` | 404 | `Event not found` | Event id unknown, in another college, or a non-published event requested by someone who does not lead it |
    | `EventActionNotAllowedError` | 403 | `This action is not allowed for this event` | Overridden per case - already published, already cancelled, cancelled and being edited, start date in the past |
    | `EventNotPublishedError` | 403 | `Event is not open for registration` | Registering for a `DRAFT` or `CANCELLED` event |
    | `RegistrationClosedError` | 403 | `Registration for this event is closed` | Registering or unregistering after the event start time |
    | `EventFullError` | 409 | `Event has reached its capacity` | Registering when `seats_left` is 0 |
    | `AlreadyRegisteredError` | 409 | `You are already registered for this event` | Duplicate registration, including two concurrent attempts racing |
    | `RegistrationNotFoundError` | 404 | `Registration not found` | No registration for this student, or the registration id belongs to a different event |
    | `NotClubMemberError` | 403 | `Only approved club members can register for this event` | Registering without an `APPROVED` membership of the hosting club |
    | `AttendanceNotAllowedError` | 403 | `Attendance can only be marked once the event has started` | Marking attendance before the event start time |
    | `NotCheckedInError` | 400 | `Result can only be set for attendees who were checked in` | Naming a winner or runner-up who was never marked present |
    | `ResultsAlreadyDeclaredError` | 409 | `Results for this event have already been declared and can no longer be changed` | Declaring results a second time, or marking attendance after results are declared |
    | `AnnouncementNotFoundError` | 404 | `Announcement not found` | Announcement id unknown or in another college |
    | `IssueNotFoundError` | 404 | `Issue not found` | Issue id unknown or in another college |
    | `IssueActionNotAllowedError` | 403 | `This action is not allowed for this issue` | Overridden with `A resolved issue cannot be replied to` or `Issue is already resolved` |
    | `NotificationNotFoundError` | 404 | `Notification not found` | Notification id unknown or belongs to another student |
    | `CertificateNotFoundError` | 404 | `Certificate not found` | Serial does not exist, or - on the download route - the certificate belongs to a different student |
    | `InvalidFileTypeError` | 400 | `This file type is not supported` | An `image` upload (club, event or profile) whose content type is not jpg, png, webp or gif |
    | `FileTooLargeError` | 413 | `The file is too large` | An `image` upload larger than 5 MB |
    | `StorageNotConfiguredError` | 500 | `File storage is not configured` | An `image` upload on a deployment with no S3 bucket configured |
    | `StorageError` | 500 | `File storage is unavailable right now` | Object storage rejected an upload |
    | `AppException` | 500 | `Something went wrong` | Base class. Any unhandled application error |

    ### 4.4 Validation errors (422)

    Schema validation is enforced before any handler runs. Constraints worth noting:

    | Field | Constraint |
    |---|---|
    | `password`, `confirm_password` | 8-255 characters, and must match on both signup and password reset |
    | `email` | Valid address, max 255, lower-cased and trimmed server-side |
    | `full_name` | 5-100 characters |
    | `email_suffix` | Lower-cased domain, e.g. `knit.ac.in`. Must match `^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$` |
    | `CreateEventRequest` | `ends_at` must be strictly after `starts_at` |
    | `DeclareResultsRequest` | `winner_registration_id` and `runner_up_registration_id` must be two different registrations |
    | `ResetPasswordRequest.token` | Non-empty string. An expired, tampered or already-used link is a `401`, not a `422` - the token is only inspected after the body passes validation |
    | `UpdateProfileRequest` | All fields optional. `bio` max 500, `roll_no` max 50, `branch` max 100, `year` between 1 and 5, `interests` at most 10 entries of 1-30 characters each. An omitted field is untouched while an explicit `null` clears it, so an empty body is valid and is not a `422` |
    | `RequestActionRequest.action` | Must be `APPROVED` or `REJECTED`. `PENDING` is rejected |
    | `GET /clubs/me` `status` | Must be sent together with `role`, and must be a valid value for that role |

    ---

    ## 5. User story traceability

    Every endpoint carries an `x-user-story` extension naming the story it serves. The table
    below is the reverse index: from each user story in the Milestone-1 deliverable to the
    endpoints that implement it.

    ### Epic 1 - Platform Foundation

    | Story | As a / I want | Endpoints |
    |---|---|---|
    | **1.1** Register a college | Campus admin registers the institution and its verified email domain | `POST /auth/signup` (role `CAMPUS_ADMIN`), `POST /college/onboarding` |
    | **1.2** Sign up and log in | A user creates an account with a college email and logs in | `POST /auth/signup`, `POST /auth/login` |

    ### Epic 2 - Club Discovery and Membership

    | Story | As a / I want | Endpoints |
    |---|---|---|
    | **2.1** Browse the club directory | Student browses a searchable list of active clubs | `GET /clubs` |
    | **2.2** View a club profile | Student opens a club's full profile before committing | `GET /clubs/{club_id}`, `GET /clubs/{club_id}/members` |
    | **2.3** Request to join a club | Student sends a formal join request in one action | `POST /clubs/{club_id}/join`, `GET /clubs/me?role=MEMBER`, `DELETE /clubs/{club_id}/join` |
    | **2.4** Manage join requests | Leader reviews and approves or rejects requests from a dashboard | `GET /clubs/{club_id}/requests`, `PATCH /clubs/{club_id}/requests/{membership_id}`, `DELETE /clubs/{club_id}/members/{student_id}` |
    | **2.5** Create a club and request approval | Leader registers a club and tracks its approval status | `POST /clubs`, `GET /clubs/me?role=LEADER`, `PUT /clubs/{club_id}`, `DELETE /clubs/{club_id}` |
    | **2.6** Approve or reject club registration | Campus admin decides pending club registrations | `GET /clubs?status=PENDING`, `PATCH /clubs/{club_id}/approve`, `PATCH /clubs/{club_id}/reject` |

    ### Epic 3 - Event Lifecycle

    | Story | As a / I want | Endpoints |
    |---|---|---|
    | **3.1** Create and publish an event | Leader creates an event and publishes it to members | `POST /events`, `PATCH /events/{event_id}/publish` |
    | **3.2** Register for an event | Student registers and receives a retrievable confirmation with a registration id | `GET /events`, `GET /events/{event_id}`, `POST /events/{event_id}/register`, `DELETE /events/{event_id}/register`, `GET /events/me/registrations` |
    | **3.3** View registered participants | Leader sees the full registration list for logistics | `GET /events/{event_id}/registrations` |
    | **3.4** Mark attendance | Leader records who actually attended | `PATCH /events/{event_id}/registrations/{registration_id}/attendance` |
    | **3.5** Set a result for each attendee | Leader assigns Winner / Runner-up / Participant | `PATCH /events/{event_id}/results` |
    | **3.6** View my event result | Student sees results from every event attended | `GET /events/me/results` |
    | **3.7** Edit or cancel an event | Leader updates details or cancels when plans change | `PUT /events/{event_id}`, `PATCH /events/{event_id}/cancel` |

    ### Epic 4 - Communication and Issue Tracking

    | Story | As a / I want | Endpoints |
    |---|---|---|
    | **4.1** Post a club announcement | Leader posts to all members from one place | `POST /announcements`, `GET /announcements/mine`, `PATCH /announcements/{announcement_id}/pin`, `DELETE /announcements/{announcement_id}` |
    | **4.2** View announcements from joined clubs | Student reads a consolidated feed | `GET /announcements`, `GET /announcements/unread-count`, `POST /announcements/read-all` |
    | **4.3** Raise an issue or query | Student submits a tracked query about registration, membership or a certificate | `POST /issues`, `GET /issues` |
    | **4.4** View and resolve member issues | Leader manages member concerns in one queue | `GET /issues/club`, `GET /issues/club/open-count`, `POST /issues/{issue_id}/reply`, `PATCH /issues/{issue_id}/resolve` |

    ### Epic 5 - Certificate Workflow

    | Story | As a / I want | Endpoints |
    |---|---|---|
    | **5.1** Auto-generate participation certificates | Leader gets a PDF for every attendee the moment results are submitted, without opening a design tool or typing a single name | `PATCH /events/{event_id}/results` - generation is a side effect of declaring results. There is no endpoint that creates a certificate directly |
    | **5.2** Download my participation certificate | Student reaches any earned certificate from their profile at any time | `GET /certificates/me`, `GET /certificates/{serial}/download`, `GET /certificates/{serial}/file` (storage fallback) |
    | **5.3** Verify a certificate by serial number | A holder or an external verifier confirms a serial is authentic without an account | `GET /certificates/verify/{serial}` |

    ### Epic 6 - AI-Powered Club Discovery

    | Story | As a / I want | Endpoints |
    |---|---|---|
    | **6.1** Find clubs by describing an interest | Student describes what they are interested in and is pointed at the clubs and events that fit, instead of reading every club profile | `POST /ai/chat` |

    ### Cross-cutting - Notification delivery

    The `Notifications` endpoints are not a numbered story. They are the delivery mechanism that
    gives stories 2.3, 2.4, 3.2 and 3.5 the confirmation that the user research identified as
    missing ("no confirmation or status visibility after any action"). Notifications are written
    as a side effect of the endpoints below and are read through
    `GET /notifications`, `GET /notifications/unread-count`,
    `PATCH /notifications/{notification_id}/read` and `POST /notifications/read-all`.

    | Notification type | Written by | Serves |
    |---|---|---|
    | `JOIN_APPROVED` / `JOIN_REJECTED` | `PATCH /clubs/{club_id}/requests/{membership_id}` | 2.3, 2.4 |
    | `REGISTRATION_CONFIRMED` | `POST /events/{event_id}/register` | 3.2 |
    | `RESULT_POSTED` | `PATCH /events/{event_id}/results` | 3.5, 3.6 |
    | `CERTIFICATE_ISSUED` | The background job queued by `PATCH /events/{event_id}/results`, once the PDF is stored | 5.1, 5.2 |

    ### Scope note

    This specification documents the endpoints implemented in the current release, which cover
    Epics 1 to 5 in full, Epic 6 (AI-powered club discovery), exposed at `POST /ai/chat`, and
    Epic 7 (club activity leaderboard), exposed at `GET /leaderboard`.

    Two endpoints support surfaces rather than stories and therefore carry no `x-user-story`.
    `GET /clubs/public/trending` feeds the "Trending clubs" section of the unauthenticated
    marketing landing page, and is - with `GET /certificates/verify/{serial}` - one of the two
    reads in the API that are not scoped to a college, because the visitor reading them has no
    account. `GET /certificates/{serial}/file` is the storage fallback behind story 5.2: on a
    deployment with no S3 bucket the generated PDF is written to Postgres instead, and the
    download links handed out by `GET /certificates/me` point at that path rather than at a
    signed S3 URL.

    Password recovery (`POST /auth/forgot-password`, `POST /auth/reset-password`) is documented
    with the rest of the `Auth` endpoints but carries no `x-user-story`. It was added after
    sprint 1 in response to user feedback rather than from the Milestone-1 story set, so mapping
    it onto a numbered story would misreport the traceability.

    The `Students` endpoints (`GET /students/me`, `PATCH /students/me`,
    `GET /students/{student_id}`) carry no `x-user-story` for the same reason. They close a gap
    the story set left open: signup collects only name, email and password, and until these
    endpoints existed nothing could write `bio`, `interests`, `roll_no`, `branch` or `year`, so
    the roll number and branch columns on participant lists and club head details were
    permanently blank.

    ---

    ## 6. Core workflows

    The order in which endpoints are called to satisfy an end-to-end journey.

    **Onboarding a college**
    `POST /auth/signup` (role `CAMPUS_ADMIN`, unregistered domain) then `POST /college/onboarding`
    to attach the college record and its verified email suffix. Students of that domain can sign
    up from that point onwards.

    **Club registration to first member**
    `POST /clubs` (an `OFFICIAL` club is created `PENDING`, an `UNOFFICIAL` club is created
    `ACTIVE` immediately) then `PATCH /clubs/{club_id}/approve` by the campus admin, then
    `POST /clubs/{club_id}/join` by a student, then
    `PATCH /clubs/{club_id}/requests/{membership_id}` by the leader.

    **Event, draft to certificate**
    `POST /events` (created `DRAFT`) then `PATCH /events/{event_id}/publish` then
    `POST /events/{event_id}/register` by approved members, then
    `GET /events/{event_id}/registrations` on the day, then
    `PATCH .../attendance` per attendee once the event has started, then
    `PATCH /events/{event_id}/results` once, naming the winner and the runner-up. That single
    call closes the event out: every other checked-in attendee becomes a `PARTICIPANT`,
    attendance and results freeze, every attendee is notified, and one certificate is queued per
    attendee. The student reads the outcome from `GET /events/me/results` and collects the PDF
    from `GET /certificates/me`.

    **Certificate to verification**
    Certificates exist only as a consequence of the call above. The student lists them with
    `GET /certificates/me`, takes a fresh signed link from `GET /certificates/{serial}/download`
    when the one in the list has expired, and prints or shares the serial. Anyone holding that
    serial - an employer, another institution - confirms it through the public
    `GET /certificates/verify/{serial}` with no account and no token.

    **Password recovery**
    `POST /auth/forgot-password` with the account email, which answers `200` whether or not the
    address is registered. The user opens the emailed link, and the client posts the token taken
    from its query string to `POST /auth/reset-password` together with the new password. The
    link is valid for 15 minutes and for one use, after which the user logs in normally.
