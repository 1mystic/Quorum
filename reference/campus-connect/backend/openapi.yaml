  /certificates/me:
    get:
      tags:
      - Certificates
      summary: List my certificates
      description: |-
        **User story 5.2 - Download My Participation Certificate** (Epic 5 - Certificate Workflow)

        > As a student, I want to access and download any of my earned certificates from my profile at any time, so that I have permanent proof of my participation that does not disappear when I change my phone.

        The caller's certificate wallet: every certificate issued to them, newest first, each with the event it came from, the result it records and a ready-to-use download link.

        This is the durable half of the story. The certificate lives against the account rather than on a device, so changing phone, losing a chat history or clearing a downloads folder costs nothing - the student signs in and the certificates are still here.

        **Access.** `STUDENT` token. Returns only the caller's own certificates; there is no way to list another student's.

        **Notes.**

        * Certificates are never created by a client. One appears here after a leader calls `PATCH /events/{event_id}/results` and the background job has stored the PDF, which is also when the student receives a `CERTIFICATE_ISSUED` notification.
        * Only checked-in attendees are issued certificates. A registration that was never marked present produces none, so this list is a strict subset of `GET /events/me/registrations`.
        * `download_url` is a signed link valid for one hour from the moment this response was generated. Cache the list if you like, but re-fetch before using a stale link, or call `GET /certificates/{serial}/download` for a fresh one.
        * An empty array is the correct answer for a student who has attended nothing yet - never a `404`.
      operationId: my_certificates_certificates_me_get
      x-epic: Epic 5 - Certificate Workflow
      x-user-story: '5.2'
      x-user-story-title: Download My Participation Certificate
      x-required-role:
      - STUDENT
      x-required-club-role: none
      responses:
        '200':
          description: The caller's certificates, newest first. Empty array if none have been issued yet.
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MyCertificateItem'
                type: array
                title: Response My Certificates Certificates Me Get
        '401':
          description: |-
            The bearer token is present but unusable, or the account role is not permitted here.

            * `Invalid token` - The token is malformed, expired, not an `access` token, or its `role` is not permitted on this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_token:
                  summary: Invalid token
                  value:
                    message: Invalid token
        '403':
          description: |-
            The caller is authenticated but not permitted, or the resource state blocks the action.

            * **Missing credentials** - the `Authorization` header is absent or is not a bearer token. This case is produced by the security scheme before application code runs and is the one error that uses the `detail` key: `{"detail": "Not authenticated"}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthenticated'
              examples:
                missing_credentials:
                  summary: No Authorization header
                  value:
                    detail: Not authenticated
        '404':
          description: |-
            The record does not exist, belongs to another college, or is not visible to the caller.

            * `Student profile not found` - The token is valid but the account has no student profile attached. A `CAMPUS_ADMIN` never has one, and campus admins do not earn certificates.
