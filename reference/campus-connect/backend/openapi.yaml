      description: |-
        **User story 5.3 - Verify a Certificate by Serial Number** (Epic 5 - Certificate Workflow)

        > As a certificate holder or external verifier, I want to enter a certificate's serial number on a public page and confirm it is authentic, so that I can share verifiable proof of participation with employers or institutions without needing to log into the platform.

        Resolves a serial to the record behind it: who earned it, for which event, hosted by which club at which college, with what result and when it was issued.

        **This and `GET /clubs/public/trending` are the only college-agnostic reads in the API.** Every other read is filtered to the caller's college, because a verifier is by definition an outsider - a recruiter at another company, an admissions office at another institution - who has no account and belongs to no college. Tenancy scoping would make verification impossible, so it is deliberately absent here.

        **Access.** Public. No token required. This is also the page behind the QR code printed on every certificate.

        **Notes.**

        * The serial is the whole credential. Serials are `CC-<abbreviated event title>-<year>-<5 random digits>`, and the random component is what stops the range being walked from a single known certificate.
        * `valid` is `true` in every `200`. An invalid serial is a `404`, not a `200` with `valid: false` - the field exists so a client can render one shape for both outcomes without special-casing the status.
        * The response deliberately exposes the student's name: confirming *who* the certificate belongs to is the point of verification. It exposes nothing else about the account - no email, no id, no other certificates.
        * The PDF itself is not returned or linked. Verification confirms the record; only the owner can download the file.
      operationId: verify_certificate_certificates_verify__serial__get
      x-epic: Epic 5 - Certificate Workflow
      x-user-story: '5.3'
      x-user-story-title: Verify a Certificate by Serial Number
      x-required-role:
      - public
      x-required-club-role: none
      parameters:
      - name: serial
        in: path
        required: true
        description: The serial printed on the certificate, for example `CC-HAC-2026-04213`. Matched exactly,
          including case.
        schema:
          type: string
          title: Serial
      responses:
        '200':
          description: The serial is authentic. Returns the record it certifies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateVerification'
        '404':
          description: |-
            The record does not exist.

            * `Certificate not found` - No certificate carries this serial. A mistyped serial and a fabricated one are indistinguishable, which is the intended answer to both.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                certificate_not_found:
                  summary: Certificate not found
                  value:
                    message: Certificate not found
        '422':
          description: The path parameter failed schema validation. Produced by the framework before the
            handler runs, so it uses the `detail` key rather than the `message` envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Something went wrong
                  value:
                    message: Something went wrong
  /certificates/{serial}/download:
    get:
      tags:
      - Certificates
      summary: Get a download link for one certificate
      description: |-
        **User story 5.2 - Download My Participation Certificate** (Epic 5 - Certificate Workflow)

        > As a student, I want to access and download any of my earned certificates from my profile at any time, so that I have permanent proof of my participation that does not disappear when I change my phone.

        Issues a fresh, time-limited link to one certificate PDF, for a client whose link from `GET /certificates/me` has aged out.

        **This does not return the PDF.** It returns JSON containing a signed URL that the client then follows, so the file is served directly by object storage rather than proxied through the API. The response also carries the filename to save it under.

        **Access.** `STUDENT` token, and the certificate must belong to the caller.

        **Notes.**

        * A serial belonging to another student returns `404 Certificate not found`, exactly as an unknown serial does. Ownership is never reported as `403`, so the endpoint cannot be used to discover which serials exist.
        * `expires_in` is seconds from the moment of the response - currently 3600. After that the link stops working and this endpoint must be called again. The certificate itself never expires; only the link does.
        * There is no rate limit on issuing links, and issuing one does not invalidate any link issued earlier.
        * Verification of the same serial is public, but downloading it is not. Anyone can confirm the certificate is real; only its owner can obtain the file.
      operationId: download_certificate_certificates__serial__download_get
      x-epic: Epic 5 - Certificate Workflow
      x-user-story: '5.2'
      x-user-story-title: Download My Participation Certificate
      x-required-role:
      - STUDENT
      x-required-club-role: none
      parameters:
      - name: serial
        in: path
        required: true
        description: Serial of one of the caller's own certificates, taken from `GET /certificates/me`.
        schema:
          type: string
          title: Serial
      responses:
        '200':
          description: A signed download link, valid for `expires_in` seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateDownloadResponse'
        '401':
          description: |-
            The bearer token is present but unusable, or the account role is not permitted here.

            * `Invalid token` - The token is malformed, expired, not an `access` token, or its `role` is not permitted on this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_token:
                  summary: Invalid token
                  value:
                    message: Invalid token
        '403':
          description: |-
            The caller is authenticated but not permitted, or the resource state blocks the action.

            * **Missing credentials** - the `Authorization` header is absent or is not a bearer token. This case is produced by the security scheme before application code runs and is the one error that uses the `detail` key: `{"detail": "Not authenticated"}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthenticated'
              examples:
                missing_credentials:
                  summary: No Authorization header
                  value:
                    detail: Not authenticated
        '404':
          description: |-
            The record does not exist, or is not visible to the caller.

            * `Student profile not found` - The token is valid but the account has no student profile attached.
            * `Certificate not found` - No certificate carries this serial, **or** it carries this serial but belongs to another student. The two cases are deliberately indistinguishable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                student_profile_missing:
                  summary: Student profile not found
                  value:
                    message: Student profile not found
                certificate_not_found:
                  summary: Certificate not found
                  value:
                    message: Certificate not found
        '422':
          description: The path parameter failed schema validation. Produced by the framework before the
            handler runs, so it uses the `detail` key rather than the `message` envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Something went wrong
                  value:
                    message: Something went wrong
      security:
      - HTTPBearer: []
  /certificates/{serial}/file:
    get:
      tags:
      - Certificates
      summary: Fetch a certificate PDF from database storage
      description: |-
        **User story 5.2 - Download My Participation Certificate** (Epic 5 - Certificate Workflow)

        > As a student, I want to download my participation certificate as a PDF from my profile, so that I can access proof of my involvement whenever I need it.

        Serves the raw PDF bytes for a certificate whose file was stored in Postgres rather than in object storage. Responds with `application/pdf` inline, not JSON.

        **This is the fallback half of certificate delivery.** When a deployment has S3 configured, the generator uploads the PDF and `GET /certificates/me` and `GET /certificates/{serial}/download` hand out short-lived signed S3 links; this endpoint is then never called. When S3 is not configured - a local run, or a demo deployment with no AWS credentials - the bytes are written to the certificate row instead and those two endpoints point at this path so the download still works.

        **Access.** Public, deliberately. It carries the same trust model as `GET /certificates/verify/{serial}`: the serial is the credential, and the random component of the serial is what stops it being guessed. It has to be reachable without a token because it is the target of the signed-link substitute handed to unauthenticated pages.

        **Notes.**

        * The response is the PDF itself with `Content-Disposition: inline; filename="{serial}.pdf"`, so a browser renders it in place rather than forcing a save.
        * A serial that exists but whose PDF went to S3 returns `404`, the same as an unknown serial - there is nothing to serve from the database in that case, and the caller should use `GET /certificates/{serial}/download` instead.
        * Unlike `GET /certificates/{serial}/download`, ownership is not checked, because there is no caller identity to check it against.
      operationId: download_certificate_file_certificates__serial__file_get
      x-epic: Epic 5 - Certificate Workflow
      x-user-story: '5.2'
      x-user-story-title: Download My Participation Certificate
      x-required-role:
      - public
      x-required-club-role: none
      parameters:
      - name: serial
        in: path
        required: true
        description: The certificate's serial, for example `CC-HAC-2026-04213`. Matched exactly, including
          case.
        schema:
          type: string
          title: Serial
      responses:
        '200':
          description: The certificate PDF, served inline as `{serial}.pdf`.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
                title: Certificate Pdf
        '404':
          description: |-
            The record does not exist, or holds no PDF bytes to serve.

            * `Certificate not found` - No certificate carries this serial, or the certificate exists but its PDF lives in object storage rather than in the database. The two cases are deliberately indistinguishable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                certificate_not_found:
                  summary: Certificate not found
                  value:
                    message: Certificate not found
        '422':
          description: The path parameter failed schema validation. Produced by the framework before the
            handler runs, so it uses the `detail` key rather than the `message` envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Something went wrong
                  value:
                    message: Something went wrong
  /leaderboard:
    get:
      tags:
      - Leaderboard
      summary: Club activity leaderboard
      description: |-
        **Epic 7 - Club Activity Leaderboard**

        > As a student, I want to see how the clubs in my college rank by how active they have been this month, so that I can find the clubs worth joining and clubs have a reason to stay active.

        The `ACTIVE` clubs of the caller's college, ordered by their activity score for the current month, highest first. Each entry carries the score and the four raw counts it was built from, so a client can show not just the rank but why a club holds it.

        The score is recomputed on every call from live data - there is no cached total. Every input is counted from the first of the current month, so on the first of each month the board effectively resets to zero without any scheduled job.

        **Score.** `events_held x 40` + `new_members x 5` + `issues_resolved x 10` + an attendance bonus of up to 200, rounded to an integer. `events_held` is this month's `PUBLISHED` events; `new_members` is `APPROVED` memberships joined this month; `issues_resolved` is issues moved to `RESOLVED` this month; the attendance bonus is `attendance_rate` (the club's average per-event check-in rate this month, over events that had at least one registration) times 200.

        **Access.** `STUDENT` token. The college is derived from the caller's account, so there is no query parameter and no way to read another college's board.

        **Notes.**

        * A club with no activity this month is still listed, with a score of 0, ranked last. An empty array means the caller's college has no `ACTIVE` clubs at all.
        * Ties break by `new_members`, then club name, so repeated calls return a stable order.
        * `attendance_rate` is a fraction between 0 and 1; `attendance_bonus` is that value scaled to 0-200 and rounded.
      operationId: leaderboard_leaderboard_get
      x-epic: Epic 7 - Club Activity Leaderboard
      x-required-role:
      - STUDENT
      x-required-club-role: none
      responses:
        '200':
          description: The college's active clubs ranked by this month's activity score, highest first. Empty array if the college has no active clubs.
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LeaderboardEntry'
                type: array
                title: Response Leaderboard Leaderboard Get
        '401':
          description: |-
            The bearer token is present but unusable, or the account role is not permitted here.

            * `Invalid token` - The token is malformed, expired, not an `access` token, or its `role` is not permitted on this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_token:
                  summary: Invalid token
                  value:
                    message: Invalid token
        '403':
          description: |-
            The caller is authenticated but not permitted.

            * **Missing credentials** - the `Authorization` header is absent or is not a bearer token. This case is produced by the security scheme before application code runs and is the one error that uses the `detail` key: `{"detail": "Not authenticated"}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthenticated'
              examples:
                missing_credentials:
                  summary: No Authorization header
                  value:
                    detail: Not authenticated
        '404':
          description: |-
            The caller's account has no college to scope the board to.

            * `College not registered` - The token is valid but the account has no college attached, so there is no leaderboard to show.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                college_not_registered:
                  summary: College not registered
                  value:
                    message: College not registered
        '500':
          description: Unhandled server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Something went wrong
                  value:
                    message: Something went wrong
      security:
      - HTTPBearer: []
  /ai/chat:
    post:
      tags:
      - AI Assistant
      summary: Ask the campus assistant (one turn)
      description: |-
        **Epic 6 - AI-Powered Club Discovery**

        > As a student, I want to describe what I am interested in and be pointed at the clubs and events that fit, so that I can find where I belong without reading every club profile on the platform.

        Runs one turn of the assistant. The client sends the whole conversation so far and gets back a reply plus the entity cards the reply refers to; the server keeps no conversation state between calls.

        The reply is produced by a bounded tool-calling loop. The model may only read the platform through a fixed set of read-only tools - club recommendation, club search, club detail, the caller's own clubs, event search, event detail and the announcement feed - each of which runs through the same services and the same college scoping as the equivalent HTTP endpoint. There is no tool that writes, so the assistant can never join a club, register for an event or post on a student's behalf.

        **Access.** `STUDENT` token. The college, and the student's own memberships, are derived from the token.

        **Grounding.** Every club and event named in the reply must have come from a tool result in the same turn. The model marks entities with `[[club:ID]]` / `[[event:ID]]` tags, and an output gate drops any tag no tool actually returned before the text is sent. `items` is built from exactly those surviving tags, so every card the client renders corresponds to a real record.

        **This endpoint does not fail on a model or data outage.** It degrades instead, along two independent axes reported as two separate flags:

        | Flag | Meaning | What produced the answer |
        |---|---|---|
        | `degraded: true` | Claude was unreachable, returned an error, or no API key is configured | The deterministic recommender, which ranks clubs by interest overlap using no model at all |
        | `offline: true` | The database was unreachable or holds no data for this college | A built-in sample campus, and the reply says so in its first sentence |

        Either can be true without the other, and a `200` with both false is the normal path.

        **Budget.** One turn is capped in code, not by prompt instruction: at most 4 model iterations, 6 tool calls, 12000 input tokens and 20 seconds. Tripping a cap is not an error - the loop tells the model to answer from what it already has, and the final reply comes back with `budget_exhausted: true`.

        **Notes.**

        * `messages` carries the prior turns of this conversation, oldest first, with `role` `user` or `assistant`. Send an empty array on the first turn.
        * `interest_text` is what the student typed into the discovery box. It seeds the durable interest memory kept per student, and is the query the deterministic recommender falls back to when the model is unreachable.
        * `kind` says what shape the answer is: `chat` for a normal agent reply, `clubs` or `popularity` for a recommender fallback that returned clubs, and `event_fallback` when the recommender found no club match and answered with events instead.
        * `items` may be empty on a perfectly good answer - a question about a joined club's next meeting has no cards to show.
        * `tools_used` and `iterations` are returned for transparency and cost tracing; a client can ignore them.
        * Prompt injection is treated as expected input: club descriptions, event text and announcements are student-authored, and the system prompt instructs the model to read them as data rather than as instructions.
      operationId: agent_chat_ai_chat_post
      x-epic: Epic 6 - AI-Powered Club Discovery
      x-required-role:
      - STUDENT
      x-required-club-role: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentChatRequest'
      responses:
        '200':
          description: One assistant turn. Returned whether the answer came from the model, from the deterministic
            recommender, or from the sample campus - check `degraded` and `offline` to tell which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentChatResponse'
        '401':
          description: |-
            The bearer token is present but unusable, or the account role is not permitted here.

            * `Invalid token` - The token is malformed, expired, not an `access` token, or its `role` is not permitted on this endpoint. A `CAMPUS_ADMIN` token fails here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_token:
                  summary: Invalid token
                  value:
                    message: Invalid token
        '403':
          description: |-
            The caller is authenticated but not permitted.

            * **Missing credentials** - the `Authorization` header is absent or is not a bearer token. This case is produced by the security scheme before application code runs and is the one error that uses the `detail` key: `{"detail": "Not authenticated"}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthenticated'
              examples:
                missing_credentials:
                  summary: No Authorization header
                  value:
                    detail: Not authenticated
        '422':
          description: The request body failed schema validation. Produced by the framework before the handler
            runs, so it uses the `detail` key rather than the `message` envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Unhandled server error. A model or database failure does not reach here - it is reported
            as a `200` with `degraded` or `offline` set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server_error:
                  summary: Something went wrong
                  value:
                    message: Something went wrong
      security:
      - HTTPBearer: []
components:
  schemas:
    AgentChatRequest:
      properties:
        messages:
          items:
            $ref: '#/components/schemas/ChatMessage'
          type: array
          title: Messages
          default: []
          description: The conversation so far, oldest first. Empty on the first turn. The server keeps
            no history of its own, so a client that drops this loses the context.
        interest_text:
          type: string
          title: Interest Text
          default: ''
          description: What the student typed into the discovery box. Seeds the durable per-student interest
            memory, and is the query the deterministic recommender uses if the model is unreachable.
      type: object
      title: AgentChatRequest
      description: One turn of input to the assistant. Both fields are optional - an empty body is a valid
        opening turn.
    AgentChatResponse:
      properties:
        reply:
          type: string
          title: Reply
          description: The assistant's prose answer, after the grounding gates have run. Entity references
            the tools did not return have already been removed.
        kind:
          type: string
          title: Kind
          description: What produced the shape of this answer. `chat` for a normal agent reply; `clubs`
            or `popularity` for a recommender fallback that returned clubs; `event_fallback` when the recommender
            found no club match and answered with events instead.
        items:
          items: {}
          type: array
          title: Items
          default: []
          description: The club or event records the reply referred to, in the order it named them, each
            carrying an `entity_kind` of `club` or `event`. Every entry came from a tool result this turn.
            Empty when the answer named no entities.
        degraded:
          type: boolean
          title: Degraded
          description: The model was unreachable, errored, or is not configured, so the deterministic recommender
            wrote this answer instead of the agent loop.
        offline:
          type: boolean
          title: Offline
          default: false
          description: The live database was unreachable or holds no data for this college, so the answer
            is grounded in the built-in sample campus. The reply says so in its first sentence.
        tools_used:
          items:
            type: string
          type: array
          title: Tools Used
          default: []
          description: Names of the read-only tools the model called this turn, for transparency and cost
            tracing. Safe for a client to ignore.
        iterations:
          type: integer
          title: Iterations
          default: 0
          description: How many model iterations the turn consumed, out of the configured maximum of 4.
        budget_exhausted:
          type: boolean
          title: Budget Exhausted
          default: false
          description: A turn cap - iterations, tool calls, input tokens or the deadline - was reached,
            so the model was asked to answer from what it already had. The reply is still a real answer,
            possibly a less complete one.
      type: object
      required:
      - reply
      - kind
      - degraded
      title: AgentChatResponse
      description: |-
        One completed assistant turn.

        `degraded` and `offline` are independent: `degraded` is about the model, `offline` is about the data. Either, both or neither may be set on a `200`.
    AnnouncementCategory:
      type: string
      enum:
      - GENERAL
      - EVENT_UPDATE
      - RESOURCE
      - ACHIEVEMENT
      - URGENT
      title: AnnouncementCategory
      description: |-
        Classification of a club announcement, used to filter the feed.

        * `GENERAL` - routine club communication.
        * `EVENT_UPDATE` - a change or reminder about an event.
        * `RESOURCE` - shared material or links.
        * `ACHIEVEMENT` - a club or member accomplishment.
        * `URGENT` - time-critical, typically pinned.
    AnnouncementItem:
      properties:
        id:
          type: integer
          title: Id
        club_id:
          type: integer
          title: Club Id
        club_name:
          type: string
          title: Club Name
        author_id:
          type: integer
          title: Author Id
        author_name:
          type: string
          title: Author Name
        title:
          type: string
          title: Title
        body:
          type: string
          title: Body
        category:
          $ref: '#/components/schemas/AnnouncementCategory'
        is_pinned:
          type: boolean
          title: Is Pinned
        unread:
          type: boolean
          title: Unread
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - club_id
      - club_name
      - author_id
      - author_name
      - title
      - body
      - category
      - is_pinned
      - unread
      - created_at
      title: AnnouncementItem
      description: One announcement in a feed. `unread` is computed per caller by comparing `created_at`
        against that student's `announcements_seen_at` watermark.
    AttendanceResponse:
      properties:
        registration_id:
          type: integer
          title: Registration Id
        student_id:
          type: integer
          title: Student Id
        full_name:
          type: string
          title: Full Name
        checked_in:
          type: boolean
          title: Checked In
        checked_in_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Checked In At
        message:
          type: string
          title: Message
      type: object
      required:
      - registration_id
      - student_id
      - full_name
      - checked_in
      - checked_in_at
      - message
      title: AttendanceResponse
      description: The registration after attendance was marked or un-marked.
    CertificateDownloadResponse:
      properties:
        serial:
          type: string
          title: Serial
        filename:
          type: string
          title: Filename
        download_url:
          type: string
          title: Download Url
        expires_in:
          type: integer
          title: Expires In
      type: object
      required:
      - serial
      - filename
      - download_url
      - expires_in
      title: CertificateDownloadResponse
      description: 'A signed link to one certificate PDF. `download_url` is time-limited: it stops working
        `expires_in` seconds after this response was generated, at which point the endpoint must be called
        again. `filename` is the name the client should save the file under.'
    CertificateVerification:
      properties:
        valid:
          type: boolean
          title: Valid
        serial:
          type: string
          title: Serial
        result:
          $ref: '#/components/schemas/RegistrationResult'
        student_name:
          type: string
          title: Student Name
        event_title:
          type: string
          title: Event Title
        event_date:
          type: string
          format: date-time
          title: Event Date
        club_name:
          type: string
          title: Club Name
        college_name:
          type: string
          title: College Name
        issued_at:
          type: string
          format: date-time
          title: Issued At
        pdf_url:
          type: string
          title: Pdf Url
          description: Direct link to the rendered certificate PDF, so a verifier can see the document
            and not just its metadata. Either a signed object-storage URL valid for 3600 seconds, or a
            link to `GET /certificates/{serial}/file` when the PDF fell back to database storage. Neither
            form requires a token, so the link can be opened straight from the public verification page.
      type: object
      required:
      - valid
      - serial
      - result
      - student_name
      - event_title
      - event_date
      - club_name
      - college_name
      - issued_at
      - pdf_url
      title: CertificateVerification
      description: |-
        The record behind an authentic serial, returned to anyone who asks - this is the only response in the API that is not scoped to a college.

        `valid` is always `true` here; an unknown serial is a `404` rather than a `200` carrying `valid: false`. The student's name is included because confirming who the certificate belongs to is the purpose of verification; nothing else about the account is exposed.

        `pdf_url` links the rendered document itself. The serial is already the unguessable credential, so the same trust model that makes this endpoint public covers the file behind it - unlike `GET /certificates/{serial}/download`, which serves the owner and does require a token.
    ChatMessage:
      properties:
        role:
          type: string
          title: Role
          description: '`user` for a student turn, `assistant` for a previous reply from this endpoint.'
        content:
          type: string
          title: Content
      type: object
      required:
      - role
      - content
      title: ChatMessage
      description: One turn of the conversation history sent back to the assistant.
    ClubDetailResponse:
