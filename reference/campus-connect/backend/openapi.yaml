        message:
          type: string
          title: Message
      type: object
      required:
      - id
      - club_id
      - title
      - status
      - message
      title: CreateEventResponse
      description: Confirmation that the event was created as a draft.
    DeclareResultsRequest:
      properties:
        winner_registration_id:
          type: integer
          title: Winner Registration Id
        runner_up_registration_id:
          type: integer
          title: Runner Up Registration Id
      type: object
      required:
      - winner_registration_id
      - runner_up_registration_id
      title: DeclareResultsRequest
      description: |-
        The two placings the leader has to name. Ids come from `GET /events/{event_id}/registrations`.

        Both registrations must be checked in, and the two ids must differ - sending the same id twice is a `422`. Every other checked-in attendee keeps the `PARTICIPANT` result they were given when their attendance was marked, so they need not be listed.
    DeclareResultsResponse:
      properties:
        event_id:
          type: integer
          title: Event Id
        winner:
          $ref: '#/components/schemas/DeclaredResultItem'
        runner_up:
          $ref: '#/components/schemas/DeclaredResultItem'
        participants:
          type: integer
          title: Participants
        certificates_queued:
          type: integer
          title: Certificates Queued
        message:
          type: string
          title: Message
      type: object
      required:
      - event_id
      - winner
      - runner_up
      - participants
      - certificates_queued
      - message
      title: DeclareResultsResponse
      description: |-
        Summary of a declaration that has already been committed.

        `participants` counts the checked-in attendees other than the two named here. `certificates_queued` counts the background jobs handed off - one per checked-in attendee, the two nominees included - and is a count of work started, not of PDFs confirmed as stored. The certificates surface in `GET /certificates/me` as each job finishes.
    DeclaredResultItem:
