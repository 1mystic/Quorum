      - member_count
      - head_name
      - created_at
      - links
      title: ClubListItem
      description: One club in the directory listing, with its live member count, leader name and external
        links. A club with no links returns `[]`, never `null`.
    ClubStatus:
      type: string
      enum:
      - PENDING
      - ACTIVE
      - REJECTED
      - ARCHIVED
      title: ClubStatus
      description: |-
        Lifecycle state of a club.

        * `PENDING` - awaiting campus admin approval. Not visible to students.
        * `ACTIVE` - approved and live. The only status that is listed to students and that accepts joins, events and announcements.
        * `REJECTED` - the campus admin declined the registration.
        * `ARCHIVED` - the leader deleted the club. Deletion is a soft state change; history is retained.
    ClubStatusResponse:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        status:
          $ref: '#/components/schemas/ClubStatus'
        message:
          type: string
          title: Message
      type: object
      required:
      - id
      - name
      - status
      - message
      title: ClubStatusResponse
      description: Confirmation of a club status change - approval, rejection or archival.
    ClubType:
      type: string
      enum:
      - OFFICIAL
      - UNOFFICIAL
      title: ClubType
      description: |-
        Whether a club claims official institutional recognition. Determines the status a newly created club starts in.

        * `OFFICIAL` - requires campus admin approval, so it is created `PENDING`.
        * `UNOFFICIAL` - a student-run community that needs no approval, so it is created `ACTIVE` and is immediately joinable.
    CollegeOnboardingRequest:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 5
